"Fundamentos",sec:"Fundamentos \u2014 Encontro 1",topicos:[{id:"lentes",t:"O que \xE9 negocia\xE7\xE3o: as tr\xEAs lentes",fonte:"Ury \xB7 Thompson \xB7 Voss \u2014 material do curso",teoria:"Negocia\xE7\xE3o \xE9 um processo interativo por meio do qual duas ou mais partes buscam chegar a um acordo m\xFAtuo \u2014 de uma mesa formal de contrato a uma conversa de corredor; muda o cen\xE1rio, n\xE3o o processo. Tr\xEAs autores iluminam \xE2ngulos diferentes. William Ury (antrop\xF3logo): comunica\xE7\xE3o de ida e volta, destinada a chegar a um acordo, quando voc\xEA e o outro lado t\xEAm alguns interesses compartilhados e outros que se op\xF5em. Leigh Thompson (psic\xF3loga): processo de tomada de decis\xE3o interpessoal, necess\xE1rio sempre que n\xE3o podemos atingir nossos objetivos sozinhos. Chris Voss (ex-FBI): negocia\xE7\xE3o \xE9 uma investiga\xE7\xE3o psicol\xF3gica. A s\xEDntese do curso: processo interativo \xB7 mistura de interesses \xB7 decis\xE3o conjunta \xB7 movido a perguntas.",insight:"Antes de cada reuni\xE3o com uma startup ou fornecedor, pergunte-se qual lente est\xE1 faltando na sua prepara\xE7\xE3o: voc\xEA mapeou os interesses (Ury)? Sabe o que n\xE3o consegue obter sozinho (Thompson)? Preparou as perguntas que v\xE3o investigar o outro lado (Voss)?"},{id:"dimensoes",t:"As tr\xEAs dimens\xF5es: Pessoas, Problemas, Processos",fonte:"Material do curso \u2014 Prof. Thiago Lima",teoria:"Toda negocia\xE7\xE3o tem tr\xEAs dimens\xF5es. Pessoas: quem est\xE1 na mesa \u2014 e quem influencia de fora, sem sentar (o conselho que aprova, o regulador do setor, a \xE1rea t\xE9cnica que pode travar). Problemas: o que est\xE1 em disputa, e raramente \xE9 uma coisa s\xF3 \u2014 numa mesa de inova\xE7\xE3o, nunca \xE9 s\xF3 dinheiro: propriedade intelectual, exclusividade, janelas de teste, royalties. Processos: as regras do jogo, quase sempre impl\xEDcitas \u2014 como se decide, quem d\xE1 a palavra final, qual o funil (pitch day \u2192 imers\xE3o \u2192 piloto). Quando a mesa trava, o problema raramente \xE9 o problema: costuma ser gente ou processo.",insight:"Regra de Ouro do curso: quem domina o processo, domina a mesa estruturalmente. Em negocia\xE7\xF5es de PDI, publicar as regras antes \u2014 crit\xE9rios, etapas, prazos \u2014 \xE9 uma vantagem que a equipe de inova\xE7\xE3o pode construir sozinha, antes de qualquer contraparte sentar."},{id:"tensoes",t:"As tr\xEAs tens\xF5es \u2014 e como administr\xE1-las",fonte:"Mnookin, Peppet & Tulumello \u2014 Beyond Winning",teoria:"Cada dimens\xE3o carrega uma tens\xE3o que n\xE3o se resolve \u2014 se administra. Em Pessoas: Assertividade \xD7 Empatia \u2014 falar ou ouvir? Defender meu ponto ou entender o do outro? Os melhores fazem os dois no m\xE1ximo. Em Problemas: Cooperar \xD7 Competir \u2014 criar valor juntos ou disputar o valor que existe (o Dilema do Negociador). Em Processos: Agente \xD7 Principal \u2014 negociar em nome de algu\xE9m cujos interesses n\xE3o s\xE3o 100% os seus. As tr\xEAs t\xE1ticas de administra\xE7\xE3o: transpar\xEAncia calibrada (revele em doses rec\xEDprocas: abra um pouco, observe, abra mais), os dois no m\xE1ximo ('entendo seu fluxo de caixa \u2014 e a regra do programa \xE9 inegoci\xE1vel'), e o mandato como escudo ('a tese aprovada pelo comit\xEA n\xE3o permite').",insight:"O mandato como escudo \xE9 especialmente \xFAtil para a equipe: limites combinados antes com a diretoria protegem na mesa \u2014 a recusa deixa de ser pessoal e vira institucional, preservando o relacionamento com a startup."},{id:"incerteza",t:"Risco \xD7 incerteza profunda",fonte:"Frank Knight (1921)",teoria:"Risco pode ser mensurado: h\xE1 probabilidades, dados hist\xF3ricos, seguros e hedging. A incerteza profunda ('knightiana') envolve desconhecidos desconhecidos \u2014 os pr\xF3prios resultados poss\xEDveis n\xE3o s\xE3o claros e n\xE3o h\xE1 base estat\xEDstica para calcular probabilidades. Negociar com startups \xE9 negociar sob incerteza, n\xE3o sob risco: o mercado pode ser inexistente, o horizonte \xE9 emergente e h\xE1 gaps informacionais estruturais entre as partes. A consequ\xEAncia contratual: em vez de contratos fixos e detalhados, contratos adaptativos \u2014 com marcos, op\xE7\xF5es reais, tranches condicionais e instrumentos que adiam decis\xF5es at\xE9 que mais informa\xE7\xE3o exista.",insight:"Quando a contraparte pedir compromissos firmes sobre resultados que ningu\xE9m pode prever, a resposta madura n\xE3o \xE9 recusar \u2014 \xE9 propor estrutura adaptativa: marcos t\xE9cnicos com libera\xE7\xE3o condicionada. Isso protege os dois lados e demonstra sofistica\xE7\xE3o."},{id:"trl",t:"TRL e os tr\xEAs regimes de negocia\xE7\xE3o",fonte:"Material do curso \u2014 Prof. Thiago Lima",teoria:"O TRL (Technology Readiness Level, escala NASA de 1 a 9) organiza a maturidade tecnol\xF3gica \u2014 e tamb\xE9m mapeia como a negocia\xE7\xE3o muda ao longo do ciclo. Regime A \u2014 Negocia\xE7\xE3o de Aprendizado (TRL 1\u20133): a pergunta \xE9 'a tecnologia funciona?', a incerteza \xE9 cient\xEDfica e o valor \xE9 valor de op\xE7\xE3o; negociam-se recursos para aprendizado. Regime B \u2014 Negocia\xE7\xE3o de Foco Estrat\xE9gico (TRL 3\u20136): 'qual problema resolver?', incerteza estrat\xE9gica, valor estrat\xE9gico; negocia-se o direcionamento da tecnologia e as parcerias. Regime C \u2014 Negocia\xE7\xE3o de Escala (TRL 6\u20139): 'essa oportunidade escala?', incerteza econ\xF4mica, valor de mercado; negociam-se valuation, participa\xE7\xE3o e governan\xE7a. Princ\xEDpio estrat\xE9gico: no in\xEDcio a incerteza \xE9 cient\xEDfica, no meio \xE9 estrat\xE9gica, no final \xE9 econ\xF4mica.",insight:"Antes de discutir n\xFAmeros com uma startup, identifique o regime. Cobrar m\xE9tricas de mercado de uma tecnologia em TRL 4 \u2014 ou aceitar apenas 'promessa t\xE9cnica' de uma em TRL 8 \u2014 \xE9 aplicar a ferramenta errada. O TRL declarado no projeto de PDI diz qual conversa cabe na mesa."}]},{id:"met",curto:"M\xE9todo",sec:"M\xE9todo e prepara\xE7\xE3o \u2014 Encontro 2",topicos:[{id:"barganha",t:"Barganha posicional e o maior pecado",fonte:"Fisher, Ury & Patton \xB7 material do curso",teoria:"Barganha posicional: cada lado declara uma posi\xE7\xE3o extrema e faz concess\xF5es graduais at\xE9 um meio-termo. Funciona numa feira, onde a rela\xE7\xE3o dura cinco minutos; para quem depende de rela\xE7\xF5es de anos, \xE9 um desastre em cinco atos: (1) produz acordos ineficientes \u2014 o meio-termo n\xE3o obedece a crit\xE9rio algum; (2) deteriora relacionamentos \u2014 cada concess\xE3o \xE9 vivida como derrota, e o ressentimento hiberna at\xE9 despertar nas decis\xF5es futuras; (3) premia o blefe \u2014 os dois lados inflam posi\xE7\xF5es at\xE9 ningu\xE9m saber o que \xE9 interesse real; (4) \xE9 letal em ecossistemas pequenos \u2014 a reputa\xE7\xE3o de negociador predat\xF3rio custa parcerias futuras; (5) consome tempo \u2014 cada semana extra queima recursos sem gerar valor. E o maior pecado: a paix\xE3o pela pr\xF3pria posi\xE7\xE3o. A partir da\xED voc\xEA n\xE3o negocia mais para resolver o problema \u2014 negocia para n\xE3o perder a queda de bra\xE7o. O ego assume o volante, e quando o objetivo vira vencer, todo mundo perde. A resposta n\xE3o \xE9 jogar melhor esse jogo: \xE9 mudar de jogo.",insight:"Sinal de alerta na mesa: quando voc\xEA se pegar defendendo um n\xFAmero porque foi voc\xEA que o disse \u2014 e n\xE3o porque um crit\xE9rio o sustenta \u2014 \xE9 a paix\xE3o pela posi\xE7\xE3o operando. V\xE1 \xE0 varanda."},{id:"harvard",t:"Os quatro princ\xEDpios de Harvard",fonte:"Fisher, Ury & Patton \u2014 Getting to Yes",teoria:"Princ\xEDpio 1 \u2014 Separe as pessoas do problema: seja duro nas quest\xF5es negociais, n\xE3o com as pessoas. Se voc\xEA pudesse simplesmente exigir o que deseja, n\xE3o haveria negocia\xE7\xE3o; se estamos na mesa, \xE9 porque precisamos do outro \u2014 e tratar mal quem voc\xEA precisa n\xE3o \xE9 dureza, \xE9 amadorismo. Princ\xEDpio 2 \u2014 Negocie orientado por interesses, n\xE3o por posi\xE7\xF5es: procure enxergar os pontos n\xE3o revelados, a raz\xE3o das posi\xE7\xF5es. Princ\xEDpio 3 \u2014 Pense em op\xE7\xF5es criativas e de satisfa\xE7\xE3o m\xFAtua: solu\xE7\xF5es precipitadas bloqueiam coopera\xE7\xE3o; crit\xE9rios e condi\xE7\xF5es podem possibilitar in\xFAmeras solu\xE7\xF5es \u2014 e lembre-se: pessoas gostam de escolher. Princ\xEDpio 4 \u2014 Defina crit\xE9rios objetivos para o resultado: pondere as op\xE7\xF5es frente aos crit\xE9rios definidos; a decis\xE3o final n\xE3o pode vir da teimosia de quem cansa o outro primeiro.",insight:"Nunca leve uma proposta \xFAnica: leve tr\xEAs estruturas aceit\xE1veis para voc\xEA. Quem escolhe entre as suas op\xE7\xF5es sente controle \u2014 e quem sente controle assina."},{id:"balcony",t:"Go to the balcony",fonte:"William Ury",teoria:"Nunca decida nada importante no calor. A varanda \xE9 o distanciamento mental de onde voc\xEA recupera o \xFAnico poder que ningu\xE9m tira de voc\xEA: o de escolher a sua rea\xE7\xE3o. E da varanda se faz a segunda coisa: avaliar a posi\xE7\xE3o da outra parte com frieza \u2014 o que ele declarou? O que ele n\xE3o declarou? Que press\xE3o ele est\xE1 sofrendo do lado de l\xE1? Quem avalia o outro no calor da mesa v\xEA um advers\xE1rio; quem avalia da varanda v\xEA um mapa.",insight:"Combine com a equipe um gatilho de varanda antes da reuni\xE3o: qualquer integrante pode pedir 'dez minutos para alinhar internamente'. Pausar n\xE3o \xE9 fraqueza \u2014 \xE9 a t\xE1tica que impede decis\xF5es que o grupo lamentaria."},{id:"interesses",t:"Tipos de interesses e a arte das concess\xF5es",fonte:"Material do curso \u2014 Prof. Thiago Lima",teoria:"Em uma negocia\xE7\xE3o t\xEDpica, voc\xEA primeiro analisa os seus interesses e os da outra parte; depois, durante a negocia\xE7\xE3o, testa se a sua percep\xE7\xE3o estava correta. Os interesses s\xE3o de tr\xEAs tipos: compartilh\xE1veis (todos desejam o mesmo \u2014 ningu\xE9m quer que a negocia\xE7\xE3o se arraste), diferentes (custo \xD7 qualidade \u2014 a base das trocas que criam valor) e conflitantes (interesses opostos, tipicamente o pre\xE7o). Medimos o sucesso pelo n\xFAmero de interesses garantidos \u2014 e eles envolvem muito mais do que dinheiro: garantias, prazos, informa\xE7\xE3o, reputa\xE7\xE3o. Como fazer concess\xF5es: destaque as suas concess\xF5es (o que \xE9 dado em sil\xEAncio n\xE3o gera cr\xE9dito), exija e defina reciprocidade, use concess\xF5es contingentes ('se voc\xEAs\u2026, ent\xE3o n\xF3s\u2026'), fracione as concess\xF5es e enfatize os benef\xEDcios.",insight:"Antes da mesa, classifique cada item do Espa\xE7o Negocial como compartilh\xE1vel, diferente ou conflitante. Os 'diferentes' s\xE3o o seu tesouro: \xE9 neles que uma concess\xE3o barata para a TAESA pode ser valiosa para a startup \u2014 e vice-versa."},{id:"posicao",t:"BATNA, posi\xE7\xE3o de desist\xEAncia, ZOPA e trocas",fig:"zopa",fonte:"Fisher, Ury & Patton \xB7 material do curso",teoria:"Quatro conceitos definem a sua posi\xE7\xE3o antes de qualquer negocia\xE7\xE3o. BATNA: sua melhor alternativa a um acordo \u2014 o curso de a\xE7\xE3o preferencial na aus\xEAncia de acordo. Ela determina em que ponto voc\xEA pode recusar uma proposta desfavor\xE1vel; sem conhec\xEA-la, voc\xEA pode rejeitar uma proposta melhor do que a que aceitar\xE1 no final, ou aceitar uma pior do que conseguiria em outra mesa. BATNA n\xE3o \xE9 loteria, \xE9 engenharia: mapear fornecedor alternativo, ativar outra linha de fomento, avan\xE7ar conversa paralela \u2014 cada alternativa real constru\xEDda fora da mesa \xE9 poder que entra com voc\xEA na sala. Posi\xE7\xE3o de desist\xEAncia (pre\xE7o de reserva): o ponto menos favor\xE1vel at\xE9 o qual voc\xEA ainda aceita o acordo; deriva da BATNA e deve representar ao menos uma pequena melhoria sobre ela. ZOPA: a zona de poss\xEDvel acordo, na coincid\xEAncia entre as duas posi\xE7\xF5es de desist\xEAncia \u2014 se n\xE3o h\xE1 sobreposi\xE7\xE3o, n\xE3o h\xE1 ZOPA, a menos que novas vari\xE1veis entrem na mesa. Gera\xE7\xE3o de valor por trocas: concess\xF5es baratas para um lado e valiosas para o outro expandem o acordo. Para estimar a BATNA e a desist\xEAncia da outra parte: fontes do setor, publica\xE7\xF5es, relat\xF3rios e o m\xE1ximo de conversas com pessoas da outra organiza\xE7\xE3o.",insight:"Nunca revele uma BATNA fraca \u2014 'precisamos fechar este m\xEAs' convida termos agressivos. E se a ZOPA n\xE3o existe no pre\xE7o, crie-a em outra dimens\xE3o: prazo, escopo, marcos, propriedade dos dados."},{id:"precee",t:"A mesa de intera\xE7\xE3o e os pilares do processo",fonte:"Material do curso \u2014 Prof. Thiago Lima",teoria:"O processo de negocia\xE7\xE3o se apoia em tr\xEAs pilares: Tempo, Informa\xE7\xE3o e Poder. E a intera\xE7\xE3o na mesa segue cinco etapas: Preliminar (coment\xE1rio inicial, o clima que abre a conversa), Raz\xF5es (interesses \u2014 por que estamos aqui), Exposi\xE7\xE3o (a apresenta\xE7\xE3o dos argumentos), Clarifica\xE7\xE3o (o ponto quase final, onde ambiguidades s\xE3o eliminadas) e Encerramento (concluir a negocia\xE7\xE3o garantindo a tomada de decis\xE3o). O fator de sucesso que as pesquisas e a pr\xE1tica mais confirmam: prepara\xE7\xE3o, prepara\xE7\xE3o e prepara\xE7\xE3o. O que separa negociadores excelentes de medianos n\xE3o \xE9 carisma, n\xE3o \xE9 agressividade, n\xE3o \xE9 l\xE1bia \u2014 \xE9 o que fizeram antes de sentar. Negocia\xE7\xE3o se ganha na v\xE9spera.",insight:"Planeje a reuni\xE3o pelas cinco etapas \u2014 inclusive quem conduz cada uma. E n\xE3o pule a Clarifica\xE7\xE3o: em contratos de PDI, \xE9 nela que se evita descobrir na assinatura que cada lado entendeu um escopo diferente."},{id:"equacao",t:"A Equa\xE7\xE3o da Influ\xEAncia",fig:"equacao",fonte:"Prof. Thiago Lima",teoria:"Influ\xEAncia = Persuas\xE3o \xF7 Resist\xEAncia. A persuas\xE3o soma tr\xEAs termos: Interesses (atendidos ou n\xE3o), Racioc\xEDnio (l\xF3gico ou n\xE3o) e Relacionamento (confian\xE7a ou desconfian\xE7a). A resist\xEAncia \xE9 o denominador \u2014 e \xE9 o que fazemos crescer sem perceber: cada acusa\xE7\xE3o sutil, cada press\xE3o desnecess\xE1ria, cada injusti\xE7a percebida aumenta o divisor e derruba a influ\xEAncia inteira, por melhores que sejam os argumentos. A prepara\xE7\xE3o trabalha o primeiro termo (interesses atendidos); racioc\xEDnio e relacionamento acontecem na mesa; e as t\xE1ticas de mesa existem, em grande parte, para impedir que a resist\xEAncia cres\xE7a \u2014 ou para reduzi-la quando j\xE1 cresceu.",insight:"Diagn\xF3stico r\xE1pido quando a mesa emperra: o problema est\xE1 no numerador ou no denominador? Se os argumentos s\xE3o bons e nada avan\xE7a, pare de argumentar \u2014 a resist\xEAncia subiu, e a sa\xEDda \xE9 r\xF3tulo, auditoria de acusa\xE7\xF5es e senso de justi\xE7a, n\xE3o mais um dado."}]},{id:"neg",curto:"O negociador",sec:"O negociador e as t\xE1ticas \u2014 Encontro 3",topicos:[{id:"argumentacao",t:"Convencer \xD7 persuadir",fonte:"Material do curso \u2014 Prof. Thiago Lima",teoria:"Convencer usa argumentos racionais: n\xFAmeros, estat\xEDsticas, fontes, leis. Persuadir usa argumentos emocionais \u2014 hist\xF3rias, analogias, met\xE1foras, exemplos, compara\xE7\xF5es \u2014 e n\xE3o deve ser confundido com manipula\xE7\xE3o. Na pr\xE1tica, os dois se entrela\xE7am: um bom argumento racional \xE9 mais convincente quando comunicado de forma emocionalmente inteligente, e uma mensagem persuasiva torna-se mais \xE9tica e duradoura quando sustentada por fatos. A chave: tente entender o modelo da outra parte e apresente, preponderantemente, os seus argumentos no modelo dela.",insight:"Com um fundador Catalisador, a hist\xF3ria do impacto convence mais que a planilha; com um Anal\xEDtico, \xE9 o inverso. Prepare as duas vers\xF5es do mesmo argumento \u2014 e escolha na mesa, depois de identificar o estilo."},{id:"cerebro",t:"C\xE9rebro pensante \xD7 c\xE9rebro emocional",fonte:"Voss \xB7 material do curso",teoria:"O c\xE9rebro pensante envolve o c\xF3rtex pr\xE9-frontal: decis\xE3o, planejamento, comportamento social, solu\xE7\xE3o de problemas. O c\xE9rebro emocional envolve o sistema l\xEDmbico \u2014 incluindo a am\xEDgdala, uma das principais \xE1reas de controle da agressividade \u2014 que dispara as respostas de luta, fuga ou congelamento. Em negocia\xE7\xF5es de alta tens\xE3o, a am\xEDgdala pode literalmente sequestrar o c\xF3rtex pr\xE9-frontal: a pessoa continua falando, mas quem responde \xE9 o medo. A maioria das decis\xF5es humanas importantes \xE9 tomada pelo sistema emocional \u2014 por isso as t\xE1ticas de empatia funcionam: verbalizar a emo\xE7\xE3o do outro reduz a ativa\xE7\xE3o da am\xEDgdala e reabre o canal racional.",insight:"Quando a contraparte endurecer de repente, n\xE3o rebata o argumento \u2014 trate a emo\xE7\xE3o primeiro ('parece que esse ponto tocou algo importante'). Argumento contra am\xEDgdala ativada \xE9 desperd\xEDcio de muni\xE7\xE3o."},{id:"confianca",t:"A base da confian\xE7a e a empatia t\xE1tica",fig:"confianca",fonte:"Voss \xB7 material do curso",teoria:"A confian\xE7a se sustenta em tr\xEAs pilares: Autenticidade (eu experimento o verdadeiro voc\xEA), L\xF3gica (seu racioc\xEDnio e julgamento s\xE3o s\xF3lidos) e Empatia (eu acredito que voc\xEA se importa comigo e com meu sucesso). Sobre essa base opera a empatia t\xE1tica: mostrar-se genuinamente interessado nos motivos, objetivos, desejos e emo\xE7\xF5es do outro lado \u2014 sem confundir com simpatia ou compaix\xE3o. N\xE3o \xE9 concordar; \xE9 compreender deliberadamente, para reduzir a reatividade da contraparte e construir influ\xEAncia baseada em confian\xE7a \u2014 o tipo de influ\xEAncia mais dur\xE1vel e de menor manuten\xE7\xE3o.",insight:"Empatia t\xE1tica n\xE3o cede nada: voc\xEA pode compreender profundamente a press\xE3o de caixa da startup e ainda assim manter a r\xE9gua do programa. Compreender primeiro torna o 'n\xE3o' subsequente muito mais aceit\xE1vel."},{id:"escuta",t:"Escuta ativa",fig:"escuta",fonte:"Material do curso \u2014 Prof. Thiago Lima",teoria:"A escuta opera em tr\xEAs zonas de ativa\xE7\xE3o: hiperativa\xE7\xE3o (reatividade emocional, defensividade, impulsividade), ativa\xE7\xE3o \xF3tima (consci\xEAncia do momento presente, abertura, curiosidade, consci\xEAncia de limites) e hipoativa\xE7\xE3o (entorpecimento, desconex\xE3o, inatividade). O tri\xE2ngulo da escuta ativa: fa\xE7a perguntas abertas \u2014 curtas, n\xE3o julgadoras, n\xE3o sugestivas; fique em sil\xEAncio at\xE9 que a outra parte responda; ou\xE7a com interesse; e reflita de volta \u2014 repetindo, parafraseando, reformulando. Dedicar mais tempo a ouvir do que a falar \xE9, sistematicamente, o comportamento que negociadores dizem menos praticar.",insight:"Meta concreta para a pr\xF3xima reuni\xE3o com startup: a equipe fala menos de 40% do tempo. Cada minuto que o fundador fala a mais \xE9 informa\xE7\xE3o de prepara\xE7\xE3o que voc\xEAs n\xE3o tinham."},{id:"vieses",t:"As armadilhas psicol\xF3gicas, uma a uma",fonte:"Kahneman \u2014 Thinking, Fast and Slow \xB7 material do curso",teoria:"Oito vieses amea\xE7am a mesa. M\xEDstica da torta fixa: assumir que o valor \xE9 fixo e que todo ganho do outro \xE9 perda sua \u2014 procure expandir a torta antes de dividi-la. Ancoragem: o primeiro n\xFAmero fixa as expectativas de todos, mesmo quando arbitr\xE1rio \u2014 n\xE3o se ancore no valor inicial. Excesso de confian\xE7a: cuidado com o otimismo, sobretudo em proje\xE7\xF5es. Enquadramento: a mesma proposta parece diferente conforme a moldura \u2014 observe diferentes perspectivas. Disponibilidade: o recente e o v\xEDvido pesam demais \u2014 procure tamb\xE9m informa\xE7\xF5es menos recentes. Confirma\xE7\xE3o: buscamos o que confirma nossas cren\xE7as \u2014 procure dados que as refutem, ou que refutem o que a outra parte sugere. Perspectiva geral: n\xE3o se perca em detalhes (lembre-se do Gorila \u2014 focados na cl\xE1usula, deixamos passar o essencial). Escalada do comprometimento: n\xE3o se comprometa demais com escolhas fracassadas \u2014 investimento passado n\xE3o justifica investimento futuro.",insight:"Designe um advogado do diabo por negocia\xE7\xE3o: algu\xE9m da equipe com o papel expl\xEDcito de buscar evid\xEAncias contr\xE1rias e perguntar 'se estiv\xE9ssemos come\xE7ando hoje, far\xEDamos essa aposta?'. Vieses raramente s\xE3o vencidos de dentro \u2014 s\xE3o vencidos por processo."},{id:"estilos",t:"Os quatro estilos de negociador",fonte:"Material do curso \u2014 Prof. Thiago Lima",teoria:"Catalisador: extrovertido, alta inflex\xE3o de voz, \xE1vido por reconhecimento; se seus interesses s\xE3o contrariados, mostra-se inconstante. Apoiador: orientado para relacionamento, busca associa\xE7\xE3o; precisa de aceita\xE7\xE3o e tende a fugir do conflito \u2014 pode prometer coisas e n\xE3o cumprir. Controlador: orientado para resultados, busca realiza\xE7\xE3o; decidido, eficiente, gosta de assumir riscos e tamb\xE9m pode ser competitivo. Anal\xEDtico: orientado para tarefas, busca seguran\xE7a; pode ser teimoso e procrastinador \u2014 quer sempre mais informa\xE7\xF5es, o que o torna indeciso. Nenhum estilo \xE9 melhor: cada um pede uma condu\xE7\xE3o diferente da mesa.",insight:"Reconhecimento p\xFAblico para o Catalisador, seguran\xE7a e tempo para o Anal\xEDtico, objetividade para o Controlador, garantias de relacionamento para o Apoiador. E cuidado com a promessa f\xE1cil do Apoiador: confirme por escrito o que foi combinado."}]},{id:"tat",curto:"20 t\xE1ticas",sec:"As 20 t\xE1ticas \u2014 Encontro 3",topicos:[{id:"vinte",t:"As t\xE1ticas e a Equa\xE7\xE3o da Influ\xEAncia",fonte:"Prof. Thiago Lima \u2014 Canvas do curso",teoria:"As vinte t\xE1ticas do Canvas n\xE3o s\xE3o uma lista solta: cada uma trabalha um termo da Equa\xE7\xE3o da Influ\xEAncia. Constroem Relacionamento (confian\xE7a): cuidar dos relacionamentos, empatia t\xE1tica, intelig\xEAncia conversacional, uso da voz, aten\xE7\xE3o ao 7-38-55 e a conclus\xE3o positiva. Alimentam Interesses e Racioc\xEDnio (persuas\xE3o): reciprocidade, prova social, espelhamento, r\xF3tulos, perguntas calibradas, avers\xE3o \xE0 perda, Ackerman e ancoragem. Derrubam a Resist\xEAncia (o denominador): senso de justi\xE7a, auditoria de acusa\xE7\xF5es e o poder do n\xE3o. E protegem a sua posi\xE7\xE3o: ceticismo saud\xE1vel, proteja-se e a disciplina da comunica\xE7\xE3o digital.",insight:"N\xE3o leve as vinte para a mesa: selecione cinco a sete para cada negocia\xE7\xE3o, distribua pap\xE9is (quem rotula, quem pergunta, quem observa) e ensaie. T\xE1tica sem dono n\xE3o acontece."},{id:"tat1",t:"1. Senso de justi\xE7a",fonte:"Thompson \u2014 material do curso",teoria:"Pessoas com poder de decis\xE3o destroem acordos vantajosos quando se sentem injusti\xE7adas \u2014 e, no sentido inverso, aceitam acordos que n\xE3o s\xE3o \xF3timos quando percebem justi\xE7a no processo. Por isso a t\xE1tica tem dois movimentos. Na abertura, estabele\xE7a o compromisso: 'se em algum momento eu for injusto, me avise para tentarmos corrigir' ou '\xE9 minha inten\xE7\xE3o trat\xE1-lo de forma justa'. E evite o uso acusat\xF3rio do termo \u2014 'fiz uma oferta justa' ou 's\xF3 quero o que \xE9 justo' soam como acusa\xE7\xE3o sutil e elevam a resist\xEAncia. Se a acusa\xE7\xE3o vier contra voc\xEA: 'eu ficaria feliz se me mostrasse onde fui injusto \u2014 estou aberto a corrigir'.",insight:"Adote a frase de abertura como padr\xE3o das mesas de PDI. Ela custa dez segundos, derruba o denominador da Equa\xE7\xE3o da Influ\xEAncia antes da pauta come\xE7ar e cria o canal para a contraparte sinalizar desconforto antes de ele virar impasse."},{id:"tat2",t:"2. Cuide dos relacionamentos",fonte:"Thompson \u2014 material do curso",teoria:"Bons relacionamentos criam confian\xE7a \u2014 e confian\xE7a modera as tentativas extremadas de exigir valor. Mesmo em agendas apertadas, encaixe um ou dois minutos de conversa genu\xEDna antes do neg\xF3cio: a pesquisa mostra que a conversa informal promove colabora\xE7\xE3o. O rapport \xE9 a faceta imediata do relacionamento: a harmonia e a sintonia do momento, que permitem que a comunica\xE7\xE3o flua. Relacionamento se constr\xF3i entre as negocia\xE7\xF5es, n\xE3o s\xF3 durante elas.",insight:"No ecossistema de inova\xE7\xE3o as mesmas pessoas se reencontram por anos \u2014 startups, universidades, fornecedores. Cada mesa \xE9 tamb\xE9m um investimento (ou um saque) na conta de relacionamento das pr\xF3ximas dez."},{id:"tat3",t:"3. Ceticismo saud\xE1vel",fonte:"Thompson \u2014 material do curso",teoria:"Confiar n\xE3o \xE9 o oposto de verificar. Mesmo em rela\xE7\xF5es de confian\xE7a, mantenha algum ceticismo sobre os motivos e as reivindica\xE7\xF5es da outra parte \u2014 n\xFAmeros de mercado, prazos prometidos, maturidade tecnol\xF3gica declarada. O ceticismo saud\xE1vel n\xE3o \xE9 hostilidade: \xE9 a disciplina de tratar afirma\xE7\xF5es como hip\xF3teses at\xE9 que venham acompanhadas de evid\xEAncia.",insight:"Em pitch de startup, todo n\xFAmero \xE9 hip\xF3tese at\xE9 documentado. Pe\xE7a a fonte com curiosidade, n\xE3o com acusa\xE7\xE3o \u2014 uma pergunta calibrada ('como voc\xEAs chegaram a esse TRL?') verifica sem ofender."},{id:"tat4",t:"4. Proteja-se",fonte:"Thompson \u2014 material do curso",teoria:"Tr\xEAs camadas de prote\xE7\xE3o antes e durante o acordo: avalie a reputa\xE7\xE3o da contraparte (hist\xF3rico, refer\xEAncias de mercado, passivos p\xFAblicos); pe\xE7a certificados e declara\xE7\xF5es de outras empresas com quem ela trabalhou; e inclua mecanismos de prote\xE7\xE3o contratual \u2014 garantias, seguros, penalidades, condi\xE7\xF5es de performance. Prote\xE7\xE3o n\xE3o \xE9 desconfian\xE7a declarada: \xE9 arquitetura de contrato.",insight:"Em projetos de PDI, a prote\xE7\xE3o natural s\xE3o os marcos com condi\xE7\xF5es de sa\xEDda limpa: se a tecnologia n\xE3o atingir o marco, o projeto encerra sem penalidade reputacional para nenhum dos lados \u2014 combinado antes, executado sem drama."},{id:"tat5",t:"5. Cultive a reciprocidade",fonte:"Cialdini \xB7 Thompson \u2014 material do curso",teoria:"Nunca fa\xE7a uma concess\xE3o sem pedir uma em troca: concess\xF5es n\xE3o correspondidas criam precedente perigoso e sinalizam presa f\xE1cil. Capitalize a norma da reciprocidade concedendo naquilo que \xE9 f\xE1cil ou menos importante para voc\xEA \u2014 e valioso para o outro. E lembre as regras de como conceder: destaque as suas concess\xF5es (o que \xE9 dado em sil\xEAncio n\xE3o gera cr\xE9dito), defina a reciprocidade esperada, use concess\xF5es contingentes ('se voc\xEAs\u2026, ent\xE3o n\xF3s\u2026'), fracione-as e enfatize os benef\xEDcios.",insight:"Prepare antes da mesa a sua lista de moedas baratas: acesso a campo de teste, visibilidade institucional, carta de refer\xEAncia, flexibilidade de cronograma. S\xE3o concess\xF5es de baixo custo para a equipe e alto valor para uma startup \u2014 o combust\xEDvel das trocas que expandem o acordo."},{id:"tat6",t:"6. Capitalize o poder da prova social",fonte:"Cialdini \u2014 material do curso",teoria:"Quando estamos incertos, procuramos os outros para orienta\xE7\xE3o \u2014 \xE9 o instinto que faz a fila na porta do restaurante parecer atestado de qualidade. Na negocia\xE7\xE3o, transmita a popularidade de uma op\xE7\xE3o: clientes satisfeitos, parceiros que renovaram, a for\xE7a da marca, o hist\xF3rico do programa. A prova social reduz a percep\xE7\xE3o de risco da contraparte sem que voc\xEA precise argumentar diretamente.",insight:"O portf\xF3lio de pilotos j\xE1 executados pelo programa \xE9 prova social institucional: 'esta estrutura de marcos \xE9 a mesma que usamos com as \xFAltimas cinco startups do portf\xF3lio' encerra discuss\xF5es que dez argumentos n\xE3o encerrariam."},{id:"tat7",t:"7. Empatia t\xE1tica",fonte:"Voss \u2014 material do curso",teoria:"Mostre-se genuinamente interessado nos motivos, objetivos, desejos e emo\xE7\xF5es do outro lado \u2014 sem confundir com simpatia ou compaix\xE3o. Empatia t\xE1tica n\xE3o \xE9 concordar: \xE9 compreender deliberadamente, porque para influenciar a perspectiva e a decis\xE3o de algu\xE9m \xE9 preciso primeiro entender de onde ela vem. A conex\xE3o aut\xEAntica reduz a reatividade da contraparte e constr\xF3i a influ\xEAncia baseada em confian\xE7a \u2014 a mais dur\xE1vel e de menor manuten\xE7\xE3o.",insight:"Compreender n\xE3o cede nada: voc\xEA pode entender profundamente a press\xE3o de caixa da startup e ainda assim manter a r\xE9gua do programa. Compreender primeiro torna o 'n\xE3o' seguinte muito mais aceit\xE1vel."},{id:"tat8",t:"8. Intelig\xEAncia conversacional",fonte:"Voss \u2014 material do curso",teoria:"Evite o seu t\xF3pico favorito \u2014 nele voc\xEA falar\xE1 demais e ouvir\xE1 de menos. Fa\xE7a perguntas sobre o que o outro lado falou: pessoas adoram falar de si, e cada resposta \xE9 informa\xE7\xE3o de prepara\xE7\xE3o que voc\xEA n\xE3o tinha. Resuma para confirmar e aprofundar: 'ent\xE3o voc\xEA acha que\u2026', 'ent\xE3o, o que voc\xEA est\xE1 dizendo \xE9\u2026'. Ouvir \xE9 a parte crucial \u2014 e \xE9 sistematicamente a que os negociadores admitem menos praticar.",insight:"Meta concreta para o kickoff com uma startup: a equipe fala menos de 40% do tempo, e o fundador conta a hist\xF3ria completa antes de qualquer requisito entrar na mesa."},{id:"tat9",t:"9. Espelhamento",fonte:"Voss \u2014 material do curso",teoria:"Repita, com curiosidade genu\xEDna na voz, as duas ou tr\xEAs \xFAltimas palavras faladas pelo interlocutor \u2014 e silencie. O espelho convida o outro a prosseguir, elaborar, explicar: \xE9 a arte de permitir que a outra parte continue falando. Use-o para construir relacionamento, extrair informa\xE7\xE3o, engajar e fomentar acordo. Como diz a m\xE1xima: pessoas interessantes s\xE3o pessoas interessadas.",insight:"Acione o espelho quando ouvir um termo vago e carregado. 'Isso \xE9 arriscado para n\xF3s.' \u2014 'Arriscado?' Tr\xEAs segundos de sil\xEAncio depois, voc\xEA saber\xE1 qual risco de verdade est\xE1 na cabe\xE7a deles."},{id:"tat10",t:"10. R\xF3tulos",fonte:"Voss \u2014 material do curso",teoria:"Rotule verbalmente a emo\xE7\xE3o e a din\xE2mica que voc\xEA observa: 'parece que voc\xEA\u2026', 'sinto que\u2026', 'acho que\u2026'. Nunca 'o que estou ouvindo \xE9\u2026' \u2014 o foco escorrega para voc\xEA. Depois do r\xF3tulo, n\xE3o complemente: silencie e deixe o efeito ocorrer; a simplicidade confere eleg\xE2ncia. O r\xF3tulo neutraliza emo\xE7\xF5es negativas ao nome\xE1-las, coleta informa\xE7\xE3o e constr\xF3i relacionamento \u2014 e a combina\xE7\xE3o cl\xE1ssica \xE9 r\xF3tulo seguido de pergunta calibrada: 'parece que voc\xEAs est\xE3o sob muita press\xE3o de prazo. O que est\xE1 por tr\xE1s desse cronograma?'.",insight:"Quando a tens\xE3o subir na mesa, rotule o elefante: 'parece que esse ponto \xE9 o mais sens\xEDvel para voc\xEAs'. Nomear a tens\xE3o a reduz \u2014 e derruba a resist\xEAncia antes que ela contamine a pauta inteira."},{id:"tat11",t:"11. Uso da voz",fonte:"Voss \u2014 material do curso",fig:"voz",teoria:"Tr\xEAs vozes, tr\xEAs fun\xE7\xF5es. A assertiva/r\xEDspida \xE9 um soco no nariz: quase sempre contraproducente, ativa a raiva do outro lado. A acomodadora/l\xFAdica \u2014 falada com um sorriso \u2014 carrega verdades pronunciadas suavemente e convida \xE0 colabora\xE7\xE3o: \xE9 a voz de ~80% do tempo. A pausada \u2014 direta, com cad\xEAncia suave e descendente \u2014 \xE9 reservada aos pontos inegoci\xE1veis: 10 a 20% do tempo. E aten\xE7\xE3o \xE0s inflex\xF5es: a interrogativa (curiosidade genu\xEDna) deve ser o padr\xE3o; a declarativa, exce\xE7\xE3o para fatos.",insight:"Reserve a voz pausada para as r\xE9guas do programa \u2014 or\xE7amento-teto, car\xE1ter inovador, prazos regulat\xF3rios. Dita nessa voz, a r\xE9gua soa inegoci\xE1vel sem que voc\xEA precise dizer a palavra 'inegoci\xE1vel'."},{id:"tat12",t:"12. Comunica\xE7\xE3o digital",fonte:"Material do curso \u2014 Prof. Thiago Lima",teoria:"N\xE3o jogue xadrez por e-mail. O texto escrito perde tom, perde contexto, congela posi\xE7\xF5es e transforma cada mensagem em documento \u2014 e ningu\xE9m faz concess\xE3o por escrito. Pontos sens\xEDveis, diverg\xEAncias e negocia\xE7\xE3o de termos pedem voz ou v\xEDdeo, onde r\xF3tulos, espelhos e uso da voz funcionam. O e-mail tem um papel nobre e um s\xF3: registrar com precis\xE3o aquilo que j\xE1 foi combinado.",insight:"Regra pr\xE1tica da equipe: se a resposta a um e-mail exigir mais de dois par\xE1grafos de argumenta\xE7\xE3o, n\xE3o responda \u2014 ligue. Depois da liga\xE7\xE3o, a\xED sim, o e-mail registra o combinado."},{id:"tat13",t:"13. Regra 7-38-55",fonte:"Mehrabian, Wiener & Ferris (1967) \xB7 Collins, Minson, Kristal & Brooks (2024)",fig:"t73855",teoria:"O cl\xE1ssico: a partir de dois estudos de 1967 na UCLA, atribuiu-se \xE0s tr\xEAs grandes \xE1reas da comunica\xE7\xE3o emocional os pesos de 7% (conte\xFAdo das palavras), 38% (tom de voz) e 55% (linguagem corporal). A atualiza\xE7\xE3o: a pesquisa recente de Collins, Minson, Kristal e Brooks redimensiona esses percentuais e as condi\xE7\xF5es em que valem \u2014 mas confirma o essencial para a mesa: tom e presen\xE7a carregam parte decisiva da mensagem, e em videoconfer\xEAncia, onde a linguagem corporal \xE9 parcialmente perdida, o tom de voz ganha import\xE2ncia desproporcional.",insight:"Nos tr\xEAs primeiros minutos de uma call dif\xEDcil, o como importa mais que o qu\xEA: voz calma, cad\xEAncia descendente, sem pressa. \xC9 ali que a contraparte decide, sem perceber, se a conversa ser\xE1 colaborativa ou defensiva."},{id:"tat14",t:"14. Perguntas calibradas",fonte:"Voss \u2014 material do curso",teoria:"Perguntas abertas iniciadas por 'o que' ou 'como', estruturadas para dar \xE0 outra parte a ilus\xE3o do controle \u2014 ela responde sentindo que conduz, enquanto reflete e fornece informa\xE7\xF5es do seu interesse. Evite o 'por qu\xEA': ativa a defesa, soa a acusa\xE7\xE3o; substitua por 'o que torna necess\xE1rio\u2026'. Exemplos de mesa: 'o que torna necess\xE1rio entregar em duas semanas?', 'como voc\xEAs fizeram esse neg\xF3cio no passado?', 'como sei que voc\xEAs cumprir\xE3o os prazos?' \u2014 e a joia da coroa, quando a exig\xEAncia \xE9 invi\xE1vel: 'como vou fazer isso?'.",insight:"Transforme cada exig\xEAncia recebida em pergunta calibrada em vez de recusa. 'Precisamos de exclusividade' \u2192 'o que a exclusividade resolve para voc\xEAs?' Quem responde est\xE1 trabalhando para voc\xEA \u2014 e quase sempre revela o interesse real atr\xE1s da posi\xE7\xE3o."},{id:"tat15",t:"15. Auditoria de acusa\xE7\xF5es",fonte:"Voss \u2014 material do curso",teoria:"Antes da conversa, liste de forma abrangente as suposi\xE7\xF5es negativas e os sentimentos que o outro lado pode ter contra voc\xEA \u2014 e antecipe-se, verbalizando-os primeiro: 'voc\xEA vai achar que n\xE3o estamos sendo transparentes\u2026', 'pode parecer que estamos ganhando tempo\u2026'. Emo\xE7\xF5es negativas n\xE3o expressas nunca morrem: ficam no subterr\xE2neo da mesa, contaminando tudo. Ir atr\xE1s delas antes que apare\xE7am desarma a acusa\xE7\xE3o \u2014 dita por voc\xEA, ela perde o veneno.",insight:"Antes de comunicar uma r\xE9gua dura do PROPDI a uma startup ansiosa, abra com as tr\xEAs cr\xEDticas prov\xE1veis: 'voc\xEAs v\xE3o achar que \xE9 burocracia, que trava o cronograma e que a regra n\xE3o faz sentido para o est\xE1gio de voc\xEAs\u2026'. O que sobrar depois disso \xE9 conversa t\xE9cnica."},{id:"tat16",t:"16. O poder do n\xE3o",fonte:"Voss \u2014 material do curso",teoria:"Inverta as perguntas que provocam o 'sim': 'voc\xEA concorda com isso?' vira 'voc\xEA discorda?'; 'faz sentido?' vira '\xE9 um momento ruim para falarmos?'. O 'sim' arrancado compromete \u2014 e por isso as pessoas o defendem com reservas mentais. No 'n\xE3o', ao contr\xE1rio, sentimo-nos seguros e protegidos, sem compromisso assumido: e \xE9 dessa seguran\xE7a que flui informa\xE7\xE3o honesta.",insight:"Com uma contraparte evasiva, teste o n\xE3o: 'seria invi\xE1vel para voc\xEAs come\xE7ar o piloto em mar\xE7o?'. Um 'n\xE3o, invi\xE1vel n\xE3o \xE9\u2026' abre a conversa real que cinco 'sins' educados vinham escondendo."},{id:"tat17",t:"17. Explore a avers\xE3o \xE0 perda",fonte:"Kahneman \xB7 Voss \u2014 material do curso",teoria:"A perda pesa mais que o ganho equivalente \u2014 \xE9 o fator dominante da decis\xE3o humana, e o medo da perda \xE9 o que mant\xE9m as pessoas acordadas de madrugada. Qualquer situa\xE7\xE3o pode ser enquadrada como ganho ou como perda: 'este investimento rende 15%' e 'n\xE3o investir custar\xE1 15%' descrevem o mesmo fato e produzem decis\xF5es diferentes. Apresente as situa\xE7\xF5es sob o prisma da perda quando quiser mobilizar \u2014 com \xE9tica: enquadre perdas reais, n\xE3o fabrique amea\xE7as.",insight:"No argumento interno pelo projeto de PDI, o enquadramento de perda \xE9 leg\xEDtimo e poderoso: o custo de n\xE3o inovar \u2014 confiabilidade que degrada, Parcela Vari\xE1vel em risco, tecnologia que o concorrente domina primeiro \u2014 decide or\xE7amentos que a promessa de ganho n\xE3o decide."},{id:"tat18",t:"18. M\xE9todo de Ackerman",fonte:"Voss \u2014 material do curso",fig:"ackerman",teoria:"Um sistema de oferta-contraoferta com incrementos decrescentes. Defina o alvo e oferte 65% dele; suba para 85%, depois 95% \u2014 e feche em um n\xFAmero quebrado e n\xE3o redondo (97,27, n\xE3o 100), acompanhado de uma vantagem n\xE3o monet\xE1ria. Os incrementos que encolhem comunicam, sem palavras, que o seu limite se aproxima; o n\xFAmero quebrado sinaliza c\xE1lculo real, n\xE3o chute; e o gesto final n\xE3o monet\xE1rio permite ao outro lado fechar sentindo que extraiu tudo.",insight:"Guarde deliberadamente uma concess\xE3o n\xE3o monet\xE1ria para o lance final \u2014 visibilidade no programa, flexibilidade de marco, acesso a campo de teste. \xC9 ela que transforma o \xFAltimo n\xFAmero na sensa\xE7\xE3o de vit\xF3ria da contraparte."},{id:"tat19",t:"19. M\xE9todo da ancoragem",fonte:"Voss \xB7 Kahneman \u2014 material do curso",fig:"ancoragem",teoria:"A primeira proposta, por mais arbitr\xE1ria que seja, serve de \xE2ncora para toda a transa\xE7\xE3o: quem joga primeiro define os par\xE2metros da conversa. A decis\xE3o de ancorar ou esperar depende do seu grau de certeza. Se voc\xEA conhece bem o valor do que negocia, fa\xE7a a primeira oferta \u2014 sustentada por crit\xE9rios objetivos, para a \xE2ncora nascer leg\xEDtima. Se h\xE1 muitas incertezas, troque informa\xE7\xF5es antes de qualquer n\xFAmero. E defenda-se das \xE2ncoras alheias: reconhe\xE7a o n\xFAmero como \xE2ncora, n\xE3o como refer\xEAncia, e reancore com crit\xE9rios.",insight:"Em PDI com escopo maduro, ancore voc\xEA \u2014 com or\xE7amento referenciado em projetos an\xE1logos. Diante de tecnologia in\xE9dita, inverta: 'antes de falar de valores, o que comp\xF5e a estrutura de custos de voc\xEAs?'. Informa\xE7\xE3o primeiro, n\xFAmero depois."},{id:"tat20",t:"20. Conclua de forma positiva",fonte:"Material do curso \u2014 Prof. Thiago Lima",teoria:"A \xFAltima impress\xE3o propaga a pr\xF3xima intera\xE7\xE3o: o fechamento \xE9 a parte da reuni\xE3o que a mem\xF3ria da contraparte guardar\xE1. Encerre com palavras positivas e colaborativas \u2014 'estamos aqui porque queremos que nossos parceiros prosperem fazendo neg\xF3cios conosco' \u2014 mesmo quando o resultado do dia foi um impasse. Acordo se celebra; impasse se encerra com a porta aberta.",insight:"O ecossistema de inova\xE7\xE3o \xE9 pequeno e as pessoas se reencontram: a startup recusada hoje pode ser a parceira ideal em dois anos. Um 'n\xE3o' bem encerrado \xE9 ativo de relacionamento; um 'n\xE3o' mal encerrado circula no mercado."}]},{id:"vc",curto:"Venture Capital",sec:"Venture Capital \u2014 termos e cl\xE1usulas",topicos:[{id:"quadro",tipo:"quadro",t:"Quadro de refer\xEAncia: o vocabul\xE1rio do VC na realidade da TAESA",fonte:"Prof. Dr. Thiago Lima \xB7 PROPDI, REN ANEEL n\xBA 1.045/2022",teoria:"Cada termo aparece com seu significado no mercado de Venture Capital e com o enquadramento correspondente na atua\xE7\xE3o da TAESA, distribu\xEDdo em tr\xEAs posi\xE7\xF5es: opera\xE7\xE3o direta em projetos de PDI, rota do M\xF3dulo 3 do PROPDI \u2014 startups como instrumento de inova\xE7\xE3o \u2014 e leitura do outro lado da mesa.",insight:"Antes de usar qualquer termo deste m\xF3dulo numa reuni\xE3o, verifique em que posi\xE7\xE3o ele est\xE1. Tratar como opera\xE7\xE3o algo que \xE9 apenas leitura gera promessa que a TAESA n\xE3o pode cumprir; tratar como leitura algo que \xE9 opera\xE7\xE3o direta desperdi\xE7a uma ferramenta que j\xE1 est\xE1 \xE0 m\xE3o."},{id:"logicavc",pos:["leitura"],taesa:"O retorno da TAESA n\xE3o obedece \xE0 lei de pot\xEAncia: \xE9 capacidade tecnol\xF3gica, resultado de projeto e conformidade regulat\xF3ria. Nada disso se aplica ao portf\xF3lio pr\xF3prio \u2014 mas \xE9 indispens\xE1vel como lente para explicar a urg\xEAncia e a ambi\xE7\xE3o da startup do outro lado. A TAESA tamb\xE9m n\xE3o ocupa a posi\xE7\xE3o de LP nem de GP: o conceito serve para identificar quem pressiona a parceira por tr\xE1s dela, e por qu\xEA.",t:"A l\xF3gica do VC: Power Law, fundo e incentivos",fonte:"Material do curso \u2014 Prof. Thiago Lima",fig:"powerlaw",teoria:"Um banco empresta e quer receber com juros \u2014 precisa de previsibilidade. Uma empresa de dois engenheiros com tecnologia n\xE3o comprovada n\xE3o \xE9 'arriscada demais' para o banco: \xE9 incalcul\xE1vel. O Venture Capital nasceu para financiar esse vazio, e para consegui-lo abandonou a l\xF3gica de empr\xE9stimo: em vez de emprestar, compra um peda\xE7o da empresa. Se ela quebrar, perde tudo \u2014 n\xE3o h\xE1 garantia a executar. Em troca, exige um potencial de retorno que nenhum empr\xE9stimo ofereceria. E o retorno \xE9 assim\xE9trico \u2014 a Power Law: num portf\xF3lio de 10 investimentos de R$ 2 milh\xF5es cada (R$ 20 milh\xF5es), 7 fracassam e devolvem R$ 0, 2 retornam 3x (R$ 12 milh\xF5es) e 1 retorna 50x (R$ 100 milh\xF5es). Total: R$ 112 milh\xF5es, 5,6x o investido \u2014 sendo que uma \xFAnica empresa respondeu por 89% de todo o resultado. A estrutura: os LPs (fundos de pens\xE3o, family offices) p\xF5em o capital; os GPs gerem, remunerados por taxa de administra\xE7\xE3o (~2%) e carried interest (~20% do lucro). Num fundo de R$ 200 milh\xF5es, a taxa d\xE1 R$ 4 milh\xF5es por ano; um retorno de R$ 600 milh\xF5es d\xE1 R$ 80 milh\xF5es de carry. O gestor n\xE3o fica rico administrando bem \u2014 fica rico acertando uma outlier.",insight:"Quando um fundador insiste em n\xFAmeros de mercado que parecem irreais, ele n\xE3o est\xE1 delirando: est\xE1 falando a l\xEDngua que o investidor dele exige ouvir. Uma startup que promete crescer de forma s\xF3lida at\xE9 virar uma empresa de m\xE9dio porte \xE9, para a l\xF3gica do fundo, um investimento ruim \u2014 o que explica por que ela resiste a contratos que a transformariam num bom fornecedor de nicho."},{id:"valuation",pos:["modulo3","leitura"],taesa:"Dilui\xE7\xE3o e valuation s\xE3o, para a TAESA, leitura do quadro societ\xE1rio da parceira \u2014 e viram opera\xE7\xE3o apenas se a rota \u201Cstartups como instrumento de inova\xE7\xE3o\u201D do M\xF3dulo 3 do PROPDI for utilizada, dentro das regras do programa. J\xE1 o rel\xF3gio do fundo \xE9 outro: o rel\xF3gio da TAESA \xE9 o ciclo do projeto e da presta\xE7\xE3o de contas (M\xF3dulo 5); o rel\xF3gio do fundo da parceira \xE9 risco de descontinuidade a mapear na avalia\xE7\xE3o pr\xE9via.",t:"Valuation, dilui\xE7\xE3o e o rel\xF3gio do fundo",fonte:"Material do curso \u2014 Prof. Thiago Lima",fig:"diluicao",teoria:"Um fundo prop\xF5e 'R$ 2 milh\xF5es a um valuation pr\xE9-money de R$ 8 milh\xF5es'. Traduzindo: pr\xE9-money \xE9 o valor antes do dinheiro entrar (R$ 8 M); post-money \xE9 pr\xE9-money mais aporte (R$ 10 M); e a participa\xE7\xE3o do investidor \xE9 aporte \xF7 post-money = 20%. Se os fundadores tinham 1.000.000 de a\xE7\xF5es, o pre\xE7o por a\xE7\xE3o \xE9 R$ 8,00 e o investidor recebe 250.000 a\xE7\xF5es novas. Ponto que confunde todo iniciante: os fundadores n\xE3o perderam a\xE7\xF5es \u2014 continuam com 500.000 cada; o percentual caiu de 50% para 40% porque o bolo cresceu. Dilui\xE7\xE3o n\xE3o \xE9 ruim por si s\xF3: \xE9 ruim quando o peda\xE7o encolhe mais do que a empresa cresce. A l\xF3gica do valuation tamb\xE9m muda com a maturidade: no in\xEDcio vale como op\xE7\xE3o futura, depois pelo posicionamento competitivo e, perto da comercializa\xE7\xE3o, por m\xE9tricas (MRR/ARR, CAC, LTV, churn, TAM). E h\xE1 um rel\xF3gio invis\xEDvel: o fundo vive cerca de dez anos \u2014 nos anos 1 a 4 h\xE1 press\xE3o para investir; nos 5 a 7, foco no portf\xF3lio; nos 8 a 10, press\xE3o por sa\xEDdas.",insight:"Pergunte de que ano \xE9 o fundo do investidor da startup. Um fundo no ano 8 pressionar\xE1 por liquidez \u2014 e uma empresa vendida no meio do seu cronograma \xE9 risco de descontinuidade, com dispers\xE3o justamente da equipe t\xE9cnica que domina o projeto."},{id:"runway",pos:["direta","leitura"],taesa:"Runway \xE9 ferramenta direta de avalia\xE7\xE3o pr\xE9via: autonomia curta da parceira \xE9 risco de execu\xE7\xE3o do projeto, a mitigar com marcos e pagamentos escalonados \u2014 nunca a explorar. O pool de op\xE7\xF5es, por outro lado, \xE9 sinal de leitura: sua exist\xEAncia indica capacidade de reter a equipe t\xE9cnica que vai executar o seu projeto.",t:"Runway e o pool de op\xE7\xF5es (ESOP)",fonte:"Material do curso \u2014 Prof. Thiago Lima",fig:"runway",teoria:"Runway \xE9 a autonomia financeira em meses: caixa \xF7 burn rate l\xEDquido mensal (despesas menos receitas). Uma empresa com R$ 1.200.000 em caixa queimando R$ 150.000 por m\xEAs tem 8 meses. Acima de 18 meses a startup negocia com calma e pode dizer n\xE3o; entre 6 e 12 a press\xE3o aparece nas concess\xF5es; abaixo de 6 entra na zona de desespero, onde qualquer capital vem com termos punitivos. O ESOP (Employee Stock Option Pool) \xE9 a reserva de participa\xE7\xE3o para contratar sem pagar sal\xE1rio de mercado \u2014 tipicamente 10% a 15%. E aqui est\xE1 uma das negocia\xE7\xF5es mais silenciosas e caras do mercado: quem paga o pool? Se ele \xE9 criado pr\xE9-money, sai inteiramente dos fundadores. No exemplo dos R$ 2 milh\xF5es a R$ 8 milh\xF5es pr\xE9-money com pool de 10% pr\xE9-money, o investidor continua pagando R$ 2 milh\xF5es mas recebe 285.714 a\xE7\xF5es em vez de 250.000 \u2014 ou seja, pagou R$ 7,00 por a\xE7\xE3o, n\xE3o R$ 8,00. O 'valuation de R$ 8 milh\xF5es' era, na pr\xE1tica, R$ 7 milh\xF5es, e o R$ 1 milh\xE3o de diferen\xE7a foi pago pelos fundadores, que ca\xEDram de 40% para 35% cada. Se o pool fosse post-money, o custo seria dividido com o investidor.",insight:"Runway curta da contraparte n\xE3o \xE9 vantagem a explorar \u2014 \xE9 risco a mitigar. Quem aceita hoje termos que n\xE3o consegue sustentar entrega mal, quebra no meio do projeto ou desaparece. Trate com marcos, pagamentos escalonados e cl\xE1usulas de continuidade."},{id:"termsheet",pos:["direta"],taesa:"H\xE1 um an\xE1logo funcional direto: a proposta de projeto de PDI submetida cumpre papel semelhante ao term sheet \u2014 define o molde antes do instrumento jur\xEDdico, e renegociar depois tamb\xE9m \xE9 caro. Ler os sinais de uma proposta, portanto, \xE9 compet\xEAncia que a TAESA exerce nos dois pap\xE9is.",t:"Term sheet: o que \xE9 e por que importa",fonte:"Material do curso \u2014 Prof. Thiago Lima",teoria:"O term sheet \xE9 a carta de inten\xE7\xF5es que precede o contrato definitivo de investimento. Tem duas ou tr\xEAs p\xE1ginas e, na maior parte, n\xE3o \xE9 juridicamente vinculante \u2014 mas tem enorme for\xE7a moral e define o molde dos documentos finais: renegociar depois da assinatura \xE9 caro e desgasta a rela\xE7\xE3o. O erro mais comum \xE9 focar apenas no valuation e ignorar as cl\xE1usulas que determinam quanto cada parte realmente recebe num evento de liquidez \u2014 e quem controla o qu\xEA no caminho. Em Venture Capital, o valuation \xE9 o n\xFAmero que todo mundo discute e a estrutura \xE9 o que efetivamente decide quem fica com quanto. O term sheet tamb\xE9m \xE9 documento de sinaliza\xE7\xE3o: termos punitivos revelam postura transacional; termos padr\xE3o de mercado com suporte operacional revelam orienta\xE7\xE3o de longo prazo. Ler os sinais das cl\xE1usulas \xE9 t\xE3o importante quanto ler os n\xFAmeros.",insight:"Quando uma startup do portf\xF3lio compartilhar um term sheet recebido, leia as cl\xE1usulas antes do valuation: elas contam quem \xE9 o investidor \u2014 e antecipam como ele se comportar\xE1 como co-habitante do cap table junto com os interesses do projeto."},{id:"liqpref",pos:["leitura"],taesa:"Prefer\xEAncia de liquida\xE7\xE3o nunca ser\xE1 cl\xE1usula da TAESA num projeto de PDI. O valor do conceito \xE9 de leitura: no quadro societ\xE1rio da parceira, prefer\xEAncias agressivas significam fundador desmotivado \u2014 e fundador desmotivado \xE9 risco de execu\xE7\xE3o no m\xE9dio prazo, justamente o horizonte de um projeto de PDI.",t:"Liquidation preference",fonte:"Material do curso \u2014 Prof. Thiago Lima",fig:"liqpref",teoria:"Define a ordem e o m\xFAltiplo de retorno do investidor num evento de liquidez (venda, IPO). Existe por raz\xE3o leg\xEDtima \u2014 o investidor entrou com dinheiro, os fundadores com trabalho \u2014 e o problema est\xE1 nas varia\xE7\xF5es. 1x non-participating: o investidor escolhe entre receber o capital de volta OU sua fatia proporcional, o que for maior \u2014 \xE9 o padr\xE3o saud\xE1vel. 1x participating ('double dip'): recebe o capital de volta E a fatia do restante. 2x\u20133x participating: recebe m\xFAltiplos do capital antes de qualquer divis\xE3o \u2014 predat\xF3rio. Os n\xFAmeros, com aporte de R$ 2 milh\xF5es por 20%: numa venda de R$ 50 milh\xF5es os fundadores ficam com R$ 40 M, R$ 38,4 M ou R$ 36,8 M \u2014 quando o sucesso \xE9 enorme, a cl\xE1usula quase n\xE3o importa. Numa venda de R$ 10 milh\xF5es, ficam com R$ 8 M, R$ 6,4 M ou R$ 4,8 M. E numa venda de R$ 4 milh\xF5es, com 2x participating o investidor leva os R$ 4 milh\xF5es inteiros e os fundadores saem com zero. A armadilha aparece justamente nos exits moderados, que s\xE3o a maioria.",insight:"Fundadores com prefer\xEAncias agressivas no cap table ficam desmotivados em sa\xEDdas moderadas \u2014 sabem que trabalhar mais tr\xEAs anos para vender por R$ 10 milh\xF5es n\xE3o muda a vida deles. Fundador desmotivado \xE9 risco de execu\xE7\xE3o em qualquer parceria de longo prazo, e isso se mapeia na due diligence."},{id:"antidiluicao",pos:["leitura"],taesa:"Sinal amarelo duplo na parceira: revela investidor transacional e cria uma bomba-rel\xF3gio societ\xE1ria que pode explodir durante o seu cronograma. N\xE3o \xE9 cl\xE1usula que a TAESA negocia \u2014 \xE9 fator de risco que a TAESA identifica antes de assinar.",t:"Anti-dilui\xE7\xE3o",fonte:"Material do curso \u2014 Prof. Thiago Lima",fig:"antidil",teoria:"Prote\xE7\xE3o do investidor ativada em down rounds \u2014 rodadas a valuation inferior ao anterior, que acontecem quando a empresa n\xE3o entrega o prometido ou o mercado vira. A cl\xE1usula ajusta retroativamente o pre\xE7o que o investidor pagou, e a dist\xE2ncia entre as duas fam\xEDlias \xE9 enorme. Situa\xE7\xE3o: o investidor comprou a R$ 8,00 por a\xE7\xE3o e a empresa capta a R$ 4,00. Com full ratchet, o pre\xE7o de convers\xE3o \xE9 resetado para o menor pre\xE7o j\xE1 praticado: suas 250.000 a\xE7\xF5es passam a valer como se ele tivesse pago R$ 4,00 desde o in\xEDcio \u2014 250.000 \xD7 (8 \xF7 4) = 500.000 a\xE7\xF5es. Ele dobra a posi\xE7\xE3o de gra\xE7a, e toda a dilui\xE7\xE3o recai sobre fundadores e funcion\xE1rios. Com weighted average broad-based, o ajuste \xE9 proporcional ao tamanho da rodada: o pre\xE7o de convers\xE3o cai de R$ 8,00 para cerca de R$ 6,86 e ele ganha aproximadamente 41.500 a\xE7\xF5es. Mesmo evento, seis vezes de diferen\xE7a. A vers\xE3o narrow-based pondera apenas as preferenciais e \xE9 mais dura com fundadores.",insight:"Full ratchet no cap table de uma startup parceira \xE9 sinal amarelo duplo: revela um investidor transacional e cria uma bomba-rel\xF3gio de dilui\xE7\xE3o. Se a empresa trope\xE7ar \u2014 e startups trope\xE7am \u2014, os fundadores podem perder o interesse na pr\xF3pria empresa exatamente durante o seu projeto."},{id:"vesting",pos:["leitura"],taesa:"Pergunta obrigat\xF3ria na avalia\xE7\xE3o pr\xE9via: sem esse mecanismo, o s\xF3cio-chave pode sair no m\xEAs seis levando o conhecimento cr\xEDtico do projeto. N\xE3o se negocia o vesting da parceira; verifica-se que ele existe.",t:"Vesting, cliff e acelera\xE7\xE3o",fonte:"Material do curso \u2014 Prof. Thiago Lima",teoria:"Vesting: aquisi\xE7\xE3o gradual da participa\xE7\xE3o societ\xE1ria ao longo do tempo \u2014 padr\xE3o de 4 anos com apura\xE7\xE3o mensal \u2014 que alinha incentivos de longo prazo e protege a empresa contra a sa\xEDda precoce de s\xF3cios-chave. Cliff: car\xEAncia inicial, padr\xE3o de 12 meses; quem sai antes n\xE3o leva nada. Um cofundador com 20% da empresa em vesting de 4 anos e cliff de 12 meses leva: nada se sair no m\xEAs 10; 25% dos 20% \u2014 ou seja, 5% da empresa \u2014 no m\xEAs 12; 30/48 = 62,5% dos 20%, ou 12,5% da empresa, no m\xEAs 30; e os 20% integrais no m\xEAs 48. Acelera\xE7\xE3o: aquisi\xE7\xE3o antecipada em eventos como M&A \u2014 single trigger acelera na venda; double trigger acelera se houver venda E o fundador for demitido depois, a vers\xE3o mais equilibrada e mais comum em term sheets bem constru\xEDdos.",insight:"Numa parceria de PDI com startup early-stage, verifique se os fundadores t\xEAm vesting. Sem vesting, um s\xF3cio-chave pode sair no meio do projeto levando participa\xE7\xE3o \u2014 e o conhecimento cr\xEDtico \u2014 sem qualquer amarra\xE7\xE3o."},{id:"controle",pos:["leitura"],taesa:"Trata-se de mapeamento de mandato: um investidor com veto amplo pode travar a parceria sem nunca sentar \xE0 mesa. Descobrir isso antes de negociar, n\xE3o na assinatura. Direito de prefer\xEAncia amplo sobre a tecnologia, em particular, afeta diretamente o resultado do PDI.",t:"Cl\xE1usulas de controle: tag, drag, board e vetos",fonte:"Material do curso \u2014 Prof. Thiago Lima",teoria:"Tag along protege minorit\xE1rios: se o controlador vende, os minorit\xE1rios vendem nas mesmas condi\xE7\xF5es. Drag along protege controladores: uma venda aprovada pela maioria arrasta todos os s\xF3cios \u2014 saud\xE1vel quando exige pre\xE7o m\xEDnimo e aprova\xE7\xE3o qualificada; perigoso por maioria simples sem piso. Board seats: a composi\xE7\xE3o do conselho \u2014 em est\xE1gio seed, o equil\xEDbrio t\xEDpico \xE9 2 fundadores + 1 investidor. Provis\xF5es protetoras: vetos do investidor sobre decis\xF5es estrat\xE9gicas (venda, mudan\xE7a de estatuto, novas emiss\xF5es) \u2014 aceit\xE1veis; vetos sobre contrata\xE7\xF5es ou despesas operacionais \u2014 invasivos. Information rights: relat\xF3rios peri\xF3dicos ao investidor; trimestral \xE9 padr\xE3o. ROFR (direito de prefer\xEAncia): o detentor pode igualar qualquer oferta de terceiro \u2014 em excesso, limita a liquidez e afugenta compradores.",insight:"Antes de estruturar um co-investimento, mapeie quem realmente decide na startup: um investidor com veto amplo pode travar decis\xF5es do projeto mesmo sem estar na mesa. Negocie com quem tem mandato \u2014 ou traga o veto para a mesa desde o in\xEDcio."},{id:"instrumentos",pos:["direta","modulo3"],taesa:"Equival\xEAncia plena em tranches e marcos: \xE9 a execu\xE7\xE3o por etapas com marcos de maturidade tecnol\xF3gica (TRL) que o M\xF3dulo 4 do PROPDI j\xE1 exige \u2014 mesmo m\xE9todo, outro nome. Notas convers\xEDveis e SAFE seguem a mesma filosofia do contrato adaptativo j\xE1 praticado em PDI, mas viram opera\xE7\xE3o direta apenas na rota do M\xF3dulo 3.",t:"Instrumentos adaptativos: notas, tranches e marcos",fonte:"Frank Knight (1921) \xB7 material do curso",fig:"tranches",teoria:"Risco pode ser medido; incerteza profunda n\xE3o \u2014 n\xE3o se sabe sequer quais s\xE3o os resultados poss\xEDveis. Negociar com startups de base tecnol\xF3gica \xE9 operar sob incerteza, e por isso contratos fixos e completos s\xE3o a ferramenta errada: fixar hoje todos os termos de um cen\xE1rio imprevis\xEDvel garante que uma das partes ficar\xE1 presa a um acordo ruim. O instrumento certo \xE9 o contrato adaptativo. Nota convers\xEDvel: d\xEDvida que converte em participa\xE7\xE3o na rodada seguinte, adiando a discuss\xE3o de valuation at\xE9 haver informa\xE7\xE3o; definida por cap (teto de valuation na convers\xE3o) e desconto (15% a 25%). Exemplo: R$ 500 mil numa nota com cap de R$ 6 milh\xF5es e desconto de 20%; se a rodada seguinte sai a R$ 12 milh\xF5es pr\xE9-money, aplica-se o mais favor\xE1vel \u2014 pelo desconto daria R$ 9,6 milh\xF5es, pelo cap R$ 6 milh\xF5es, ent\xE3o vale o cap: o investidor recebe o dobro de a\xE7\xF5es por real investido em rela\xE7\xE3o a quem entra agora. O SAFE \xE9 a vers\xE3o simplificada, sem juros nem vencimento. Tranches condicionais: capital liberado em etapas vinculadas a marcos t\xE9cnicos. Earn-outs e milestone payments condicionados a TRL. Exclusividade limitada: sempre com prazo (18\u201336 meses), escopo e condi\xE7\xF5es de performance \u2014 nunca perp\xE9tua.",insight:"Esses instrumentos s\xE3o o vocabul\xE1rio natural do co-investimento em PDI: marcos por TRL e libera\xE7\xE3o por etapas alinham desembolso e aprendizado, e d\xE3o \xE0 equipe pontos de sa\xEDda limpos se a tecnologia n\xE3o performar. Voc\xEA j\xE1 opera nessa l\xF3gica \u2014 o que falta \xE9 o repert\xF3rio para negoci\xE1-la com precis\xE3o."},{id:"cvc",pos:["direta","modulo3"],taesa:"\xC9 a posi\xE7\xE3o mais pr\xF3xima da TAESA \u2014 com um bra\xE7o a mais no abra\xE7o: recursos regulados, divulga\xE7\xE3o p\xFAblica do portf\xF3lio e destino pr\xF3prio das receitas de explora\xE7\xE3o (M\xF3dulo 6 do PROPDI). As cinco prote\xE7\xF5es valem nos dois sentidos, e \u201Cpiloto pago antes de equity\u201D \xE9 a tradu\xE7\xE3o exata da l\xF3gica de um projeto de PDI.",t:"Corporate Venture Capital e o abra\xE7o de urso",fonte:"Material do curso \u2014 Prof. Thiago Lima",teoria:"O CVC \u2014 investimento de uma corpora\xE7\xE3o em startups \u2014 busca retorno financeiro e alinhamento estrat\xE9gico, e por isso aceita retornos menores quando o valor estrat\xE9gico \xE9 alto. Mas traz riscos conhecidos como 'abra\xE7o de urso': afugentar clientes concorrentes da corpora\xE7\xE3o, transformar a startup em P&D terceirizado, criar conflitos de governan\xE7a, limitar op\xE7\xF5es de exit e impor a velocidade decis\xF3ria corporativa. As prote\xE7\xF5es cl\xE1ssicas, dos dois lados da mesa: exclusividade limitada em tempo e escopo, marcos de performance para manter benef\xEDcios, independ\xEAncia de governan\xE7a (assento de observador em vez de voto), piloto pago antes de equity, e cl\xE1usula de sa\xEDda limpa com recompra a valor justo.",insight:"'Piloto pago antes de equity' \xE9 a tradu\xE7\xE3o exata da l\xF3gica PDI \u2014 a estrutura regulat\xF3ria em que voc\xEA j\xE1 opera \xE9 uma das melhores pr\xE1ticas do mercado de CVC. E seis perguntas de due diligence d\xE3o conta do resto, todas padr\xE3o de mercado: qual o runway de voc\xEAs? Quem s\xE3o os investidores e de que ano \xE9 o fundo principal? Os fundadores t\xEAm vesting? H\xE1 exclusividades j\xE1 assinadas? Algum investidor tem veto sobre parcerias comerciais? Existe cl\xE1usula de prefer\xEAncia sobre a tecnologia? A recusa em responder qualquer uma delas \xE9, por si s\xF3, informa\xE7\xE3o."}]}],Lm=$t.flatMap(e=>e.topicos),Mm={background:xa,border:`1px solid ${Eo}`,b
