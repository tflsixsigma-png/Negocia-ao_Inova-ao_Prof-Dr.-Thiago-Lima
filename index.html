",t:"3) Processo",teoria:"precee",campos:["Como organizamos a negocia\xE7\xE3o?","Como processamos a troca de informa\xE7\xF5es?","Quais quest\xF5es log\xEDsticas precisam ser resolvidas na negocia\xE7\xE3o?"]},{id:"batna",t:"4) BATNA",teoria:"posicao",campos:["Quais s\xE3o todas as minhas alternativas caso n\xE3o haja acordo?","Qual \xE9 a melhor delas \u2014 e quanto ela vale?","Como posso fortalec\xEA-la antes de sentar \xE0 mesa?","Qual \xE9 a BATNA prov\xE1vel da outra parte, e como estimei?"]},{id:"desistencia",t:"5) Posi\xE7\xE3o de desist\xEAncia",teoria:"posicao",campos:["Qual \xE9 o ponto menos favor\xE1vel at\xE9 o qual eu ainda aceito o acordo (com n\xFAmero)?","Essa posi\xE7\xE3o representa uma melhoria em rela\xE7\xE3o \xE0 minha BATNA?","Qual \xE9 a posi\xE7\xE3o de desist\xEAncia prov\xE1vel da outra parte \u2014 e, portanto, onde estimo a ZOPA?"]},{id:"mesa",t:"6) A mesa",teoria:"equacao",campos:["Qual ser\xE1 a frase de abertura?","Quem faz o qu\xEA na equipe (quem conduz, quem pergunta, quem observa e registra)?","Qual a agenda da reuni\xE3o, pelas cinco etapas da mesa de intera\xE7\xE3o?"]}],Om=["Menor custo","Maior confiabilidade","Maior qualidade","Maior agilidade","Maior seguran\xE7a","Redu\xE7\xE3o de perdas"],$n=["Co-investimento PDI (ANEEL)","Fornecedor / EPC","Parceria com universidade ou ICT","Outro"],cs=()=>{let e={};return Qo.forEach(o=>{e[o.id]=o.campos.map(()=>"")}),{id:Date.now(),nome:"",contraparte:"",tipo:$n[0],emJogo:"",caderno:e,pessoas:[],vcap:{ativos:"",processos:"",capacidades:"",impactos:[],outros:"",sintese:""}}},ls=()=>{let e=cs();return e.id=1,e.nome="Piloto de inspe\xE7\xE3o de linhas com drones",e.contraparte="DroneCheck",e.tipo=$n[0],e.emJogo="Estruturar um projeto de PDI em co-investimento para validar inspe\xE7\xE3o aut\xF4noma de linhas de transmiss\xE3o com drones e vis\xE3o computacional. Um bom acordo garante car\xE1ter inovador defens\xE1vel no enquadramento PROPDI, acesso irrestrito aos dados brutos das inspe\xE7\xF5es, marcos t\xE9cnicos por TRL com sa\xEDda limpa, e cronograma compat\xEDvel com o ciclo regulat\xF3rio.",e.caderno.pessoas=["Do nosso lado: gestora do programa de inova\xE7\xE3o (conduz) e engenheiro de manuten\xE7\xE3o de linhas (avalia viabilidade t\xE9cnica). Do lado da DroneCheck: os dois s\xF3cios-fundadores \u2014 o CTO, que responde pela tecnologia, e o CEO, que decide comercial.","Nosso diretor de opera\xE7\xF5es aprova o desembolso acima do teto da ger\xEAncia e assina o enquadramento do projeto. Na DroneCheck, h\xE1 um investidor anjo com assento de observador que n\xE3o senta \xE0 mesa, mas \xE9 consultado em cl\xE1usulas de propriedade intelectual.","A equipe de manuten\xE7\xE3o, que defende internamente um contrato de servi\xE7o convencional com a VistaLinha e pode reabrir a discuss\xE3o no comit\xEA. A \xE1rea jur\xEDdica, que revisa a minuta ao final. E o regulador, que n\xE3o participa mas define o enquadramento \u2014 o que torna o car\xE1ter inovador um requisito, n\xE3o uma prefer\xEAncia."],e.caderno.problemas=["Nosso objetivo: validar em campo se a inspe\xE7\xE3o aut\xF4noma detecta anomalias em cadeias de isoladores com confiabilidade compar\xE1vel \xE0 inspe\xE7\xE3o tripulada, a um custo por quil\xF4metro menor, e internalizar a capacidade. Prioridades, em ordem: enquadramento PDI defens\xE1vel, propriedade dos dados, marcos verific\xE1veis, pre\xE7o. Objetivo prov\xE1vel da DroneCheck: um contrato de refer\xEAncia com uma transmissora, que valida a tecnologia e serve de prova social na pr\xF3xima capta\xE7\xE3o.","Piloto de seis meses em dois trechos de perfis distintos, com escopo fechado e op\xE7\xE3o de extens\xE3o. Compara\xE7\xE3o cega contra a inspe\xE7\xE3o convencional nos mesmos trechos, para gerar evid\xEAncia e n\xE3o impress\xE3o. Licen\xE7a de uso do modelo para a nossa opera\xE7\xE3o, com a DroneCheck mantendo a propriedade do algoritmo e n\xF3s a propriedade dos dados coletados na nossa rede. Contrapartida n\xE3o monet\xE1ria: acesso a campo de teste e carta de refer\xEAncia ao fim do piloto, se as metas forem atingidas.","Crit\xE9rios objetivos, n\xE3o prefer\xEAncias: custo por quil\xF4metro inspecionado comparado \xE0 linha de base atual; taxa de detec\xE7\xE3o e de falso positivo medidas contra laudo de inspe\xE7\xE3o tripulada; e or\xE7amento referenciado em projetos PDI an\xE1logos do setor, j\xE1 aprovados. Para o car\xE1ter inovador, o argumento \xE9 o desenvolvimento de capacidade nova de inspe\xE7\xE3o preditiva cont\xEDnua \u2014 n\xE3o a substitui\xE7\xE3o de rotina remunerada pela RAP, que \xE9 exclus\xE3o expressa.","Desenvolver a capacidade por rota alternativa: o laborat\xF3rio da universidade parceira demonstrou prot\xF3tipo funcional de vis\xE3o computacional aplic\xE1vel ao mesmo problema. \xC9 tecnicamente vi\xE1vel, por\xE9m cerca de 40% mais caro, com 9 a 12 meses adicionais e sem hist\xF3rico de opera\xE7\xE3o em campo. \xC9 uma alternativa real, e \xE9 o que sustenta nossa posi\xE7\xE3o."],e.caderno.processo=["Tr\xEAs encontros com prop\xF3sito declarado: (1) t\xE9cnico, sem n\xFAmeros, para alinhar escopo, TRL de partida e crit\xE9rios de sucesso; (2) comercial, com proposta estruturada em tr\xEAs configura\xE7\xF5es de escopo e pre\xE7o; (3) fechamento com a minuta j\xE1 revisada pelo jur\xEDdico. N\xF3s publicamos a agenda e os crit\xE9rios antes de cada reuni\xE3o \u2014 quem organiza o processo conduz a mesa.","Reciprocidade calibrada: abrimos primeiro nossa linha de base de custo por quil\xF4metro, que \xE9 informa\xE7\xE3o pouco sens\xEDvel, e pedimos em troca a estrutura de custos do piloto. N\xE3o revelamos o teto or\xE7ament\xE1rio nem o prazo interno de aprova\xE7\xE3o. Pedimos o relat\xF3rio do \xFAltimo piloto executado pela DroneCheck em outra transmissora, com dados anonimizados.","Definir os dois trechos e as janelas de acesso \xE0 faixa de servid\xE3o, incluindo autoriza\xE7\xE3o de sobrevoo e o protocolo de seguran\xE7a. Confirmar cobertura de seguro de responsabilidade civil da DroneCheck para opera\xE7\xE3o sobre linha energizada. Acordar formato e periodicidade da entrega dos dados brutos. Registrar por escrito, ap\xF3s cada reuni\xE3o, o que foi combinado \u2014 sem negociar termos por e-mail."],e.caderno.batna=["Quatro alternativas mapeadas: (a) desenvolver com o laborat\xF3rio da universidade parceira, que j\xE1 tem prot\xF3tipo funcional; (b) contratar a VistaLinha, concorrente da DroneCheck, em modelo de servi\xE7o puro \u2014 resolve inspe\xE7\xE3o, mas n\xE3o desenvolve capacidade interna nem se enquadra como PDI; (c) adiar o projeto para o ciclo seguinte, mantendo a inspe\xE7\xE3o convencional; (d) estruturar o projeto com outra startup do nosso pr\xF3prio programa, hoje em TRL menor.","A melhor \xE9 a rota com a universidade: preserva o car\xE1ter inovador e o enquadramento PDI, e desenvolve capacidade pr\xF3pria \u2014 que \xE9 o multiplicador na an\xE1lise de valor. Custa cerca de 40% mais e atrasa de 9 a 12 meses. Vale, portanto, o valor do projeto menos esse pr\xEAmio de tempo e custo. N\xE3o \xE9 uma alternativa confort\xE1vel, mas \xE9 real e verific\xE1vel.","Antes da mesa: obter do laborat\xF3rio uma carta de inten\xE7\xE3o com estimativa de prazo e custo, transformando a alternativa de conversa em documento. Confirmar com o regulador, pela via de consulta, o enquadramento da rota alternativa. Sondar a VistaLinha para conhecer o pre\xE7o de mercado do servi\xE7o, ainda que n\xE3o seja o caminho pretendido.","A BATNA prov\xE1vel da DroneCheck \xE9 fraca: fechar com outra transmissora de porte menor, o que rende menos receita e prova social mais fraca. Estimei por tr\xEAs vias \u2014 o site deles lista apenas pilotos com distribuidoras regionais; captaram uma rodada anjo h\xE1 cerca de 14 meses, o que sugere caixa apertado; e o CEO mencionou em evento do setor que buscava um contrato de refer\xEAncia com transmissora. Essa combina\xE7\xE3o indica press\xE3o por fechar. N\xE3o vamos explorar isso: runway curta da contraparte \xE9 risco de descontinuidade do projeto, n\xE3o vantagem \u2014 por isso o desembolso ser\xE1 escalonado por marcos."],e.caderno.desistencia=["N\xE3o assinamos sem tr\xEAs condi\xE7\xF5es, independentemente do pre\xE7o: acesso irrestrito e perp\xE9tuo aos dados brutos das inspe\xE7\xF5es da nossa rede; marco de valida\xE7\xE3o em seis meses com crit\xE9rio de aceita\xE7\xE3o definido em n\xFAmero e op\xE7\xE3o de encerramento sem penalidade; e car\xE1ter inovador documentado de forma a sustentar o enquadramento PROPDI. No or\xE7amento, o teto \xE9 o valor da rota alternativa com a universidade, descontado o pr\xEAmio de prazo \u2014 abaixo disso o acordo vale; acima, a alternativa \xE9 melhor.","Sim. A rota com a universidade custa mais e demora mais, ent\xE3o qualquer acordo com a DroneCheck dentro do teto representa melhoria real sobre a alternativa \u2014 em custo, em prazo e em risco de execu\xE7\xE3o, j\xE1 que a tecnologia deles tem hist\xF3rico em campo. A margem de melhoria \xE9 confort\xE1vel, o que nos permite negociar sem ansiedade.","A posi\xE7\xE3o de desist\xEAncia da DroneCheck deve ser bem abaixo do nosso teto: precisam de um contrato de refer\xEAncia com transmissora e t\xEAm alternativa fraca, ent\xE3o provavelmente aceitam um piloto que cubra custo com margem modesta. H\xE1 ZOPA folgada em pre\xE7o. Isso desloca a negocia\xE7\xE3o para onde ela de fato importa: propriedade dos dados, defini\xE7\xE3o dos marcos e crit\xE9rios de aceita\xE7\xE3o \u2014 e \xE9 ali que vamos gastar o tempo da mesa."],e.caderno.mesa=['"Antes de qualquer coisa: se em algum momento a gente for injusto com voc\xEAs, avisem, que a gente corrige. Nossa inten\xE7\xE3o aqui \xE9 sair com um piloto que sirva para os dois lados \u2014 para voc\xEAs como caso de refer\xEAncia, para n\xF3s como capacidade nova." Em seguida, auditoria de acusa\xE7\xF5es: "voc\xEAs provavelmente v\xE3o achar que o processo de uma transmissora \xE9 burocr\xE1tico, que o prazo regulat\xF3rio trava o cronograma de voc\xEAs, e que a exig\xEAncia de car\xE1ter inovador \xE9 formalidade nossa. Vamos falar disso primeiro."','A gestora do programa conduz, faz a abertura e controla o tempo. O engenheiro de manuten\xE7\xE3o assume o bloco t\xE9cnico e \xE9 o \xFAnico a falar sobre TRL e crit\xE9rios de aceita\xE7\xE3o \u2014 o que d\xE1 a ele a lideran\xE7a natural naquela etapa. Ningu\xE9m menciona valores na primeira reuni\xE3o: se o assunto vier, a resposta \xE9 a pergunta calibrada "o que comp\xF5e a estrutura de custos do piloto de voc\xEAs?". Um integrante fica sem falar, apenas registrando o que a contraparte diz e as rea\xE7\xF5es \u2014 \xE9 quem alimenta o debriefing.',"Preliminar: reconhecer o trabalho deles e declarar o compromisso de justi\xE7a (5 min). Raz\xF5es: por que estamos nesta mesa, de ambos os lados, com escuta antes de exposi\xE7\xE3o (20 min). Exposi\xE7\xE3o: nosso escopo, os crit\xE9rios objetivos e as tr\xEAs configura\xE7\xF5es poss\xEDveis (25 min). Clarifica\xE7\xE3o: eliminar ambiguidade sobre dados, marcos e propriedade intelectual \u2014 sem pular esta etapa, que \xE9 onde nascem os desentendimentos de assinatura (20 min). Encerramento: registrar decis\xF5es, definir pr\xF3ximos passos com respons\xE1vel e data, e fechar de forma positiva (10 min)."],e.pessoas=[{nome:"CEO da DroneCheck (decide comercial)",estilo:"catalisador"},{nome:"CTO da DroneCheck (responde pela tecnologia)",estilo:"analitico"},{nome:"Investidor anjo (observador, consultado em PI)",estilo:"controlador"}],e.vcap={ativos:"Base propriet\xE1ria de imagens rotuladas das nossas linhas, com anomalias classificadas e laudo de refer\xEAncia \u2014 ativo que permanece nosso e permite treinar ou auditar qualquer modelo futuro. Modelo de vis\xE3o computacional licenciado para nossa opera\xE7\xE3o, calibrado para os perfis construtivos da nossa rede. Protocolo homologado de opera\xE7\xE3o de drone sobre linha energizada, incluindo plano de seguran\xE7a e matriz de risco.",processos:"Fluxo de inspe\xE7\xE3o aut\xF4noma com prioriza\xE7\xE3o por criticidade do ativo, substituindo a varredura por calend\xE1rio. Integra\xE7\xE3o do resultado da inspe\xE7\xE3o ao planejamento de manuten\xE7\xE3o, de modo que a detec\xE7\xE3o gere ordem de servi\xE7o sem etapa manual. Rotina de auditoria da precis\xE3o do modelo contra inspe\xE7\xE3o tripulada por amostragem, que mant\xE9m a confian\xE7a na ferramenta ao longo do tempo.",capacidades:"Capacidade de inspe\xE7\xE3o preditiva cont\xEDnua da rede, sem depender de janela de equipe em campo \u2014 a organiza\xE7\xE3o passa a saber antecipar falha em cadeia de isoladores em vez de reagir a ela. Capacidade de especificar, avaliar e auditar tecnicamente solu\xE7\xF5es de inspe\xE7\xE3o aut\xF4noma, o que nos torna comprador qualificado nas pr\xF3ximas contrata\xE7\xF5es do setor. Capacidade de operar drone sobre linha energizada com protocolo pr\xF3prio.",impactos:["Maior confiabilidade","Menor custo","Maior agilidade","Maior seguran\xE7a"],outros:"Redu\xE7\xE3o da exposi\xE7\xE3o de equipes a risco em trabalho em altura e em faixa de servid\xE3o de dif\xEDcil acesso.",sintese:"O projeto desenvolve ativos de dados e modelo, e transforma o processo de inspe\xE7\xE3o de calend\xE1rio para criticidade \u2014 mas o que sustenta o argumento de valor \xE9 a capacidade nova: inspe\xE7\xE3o preditiva cont\xEDnua e qualifica\xE7\xE3o t\xE9cnica para avaliar essa classe de tecnologia. Sem essa capacidade habilitada, ativos e processos n\xE3o gerariam valor, porque a estrutura \xE9 multiplicativa: um contrato que entregasse apenas o servi\xE7o de inspe\xE7\xE3o deixaria C igual a zero e, com ele, o valor inteiro \u2014 al\xE9m de descaracterizar o enquadramento PDI, j\xE1 que inspe\xE7\xE3o de rotina remunerada pela RAP \xE9 exclus\xE3o expressa. O impacto se materializa em confiabilidade (antecipa\xE7\xE3o de falha), custo (menor custo por quil\xF4metro inspecionado), agilidade (inspe\xE7\xE3o sem janela de equipe) e seguran\xE7a (menos exposi\xE7\xE3o de pessoas em campo)."},e},Dm=`
:root{
  --navy:#0E2A47; --navy-2:#16395E;
  --gold:#C9A227; --gold-soft:#F1E8CB; --gold-dim:#8A6D1D;
  --paper:#F7F4EC; --card:#fff; --ink:#22303E; --mut:#66717F; --line:#E3DECF;
  --serif:Cambria,Caladea,Georgia,"Times New Roman",serif;
  --sans:"Segoe UI","Helvetica Neue",Arial,sans-serif;
  --rail:248px; --measure:1180px;
  --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px;
  --shadow:0 1px 2px rgba(14,42,71,.04), 0 8px 24px -12px rgba(14,42,71,.12);
  --shadow-up:0 2px 4px rgba(14,42,71,.06), 0 16px 40px -16px rgba(14,42,71,.20);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit}
::selection{background:var(--gold-soft)}
:focus{outline:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:3px}

/* ---- barra superior ---- */
.topbar{position:sticky;top:0;z-index:50;background:var(--navy);
  border-bottom:3px solid var(--gold);
  display:flex;align-items:center;justify-content:space-between;gap:var(--s5);
  padding:var(--s3) var(--s6)}
.brand{display:flex;flex-direction:column;gap:2px;cursor:pointer;border:none;background:none;padding:0;text-align:left}
.brand-t{font-family:var(--serif);font-size:18px;font-weight:700;color:#fff;line-height:1.2}
.brand-t em{font-style:normal;font-weight:400;color:var(--gold)}
.brand-n{font-family:var(--sans);font-size:11.5px;letter-spacing:.08em;color:#9FB0C2}
.topnav{display:flex;align-items:center;gap:var(--s5)}
.topnav .tn{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--gold);
  background:none;border:none;cursor:pointer;padding:6px 2px;position:relative;transition:color .18s}
.topnav .tn::after{content:"";position:absolute;left:0;right:0;bottom:0;height:1.5px;
  background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform .22s}
.topnav .tn:hover{color:#fff}
.topnav .tn:hover::after,.topnav .tn.on::after{transform:scaleX(1)}
.ver{font-family:var(--sans);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:#7E93A8;padding-left:var(--s4);border-left:1px solid rgba(255,255,255,.14)}

/* ---- estrutura: trilha lateral + conte\xFAdo ---- */
.shell{display:flex;align-items:stretch;min-height:calc(100vh - 74px)}
.rail{width:var(--rail);flex:0 0 var(--rail);border-right:1px solid var(--line);
  background:#FBF9F3;padding:var(--s6) 0;display:flex;flex-direction:column}
.railhead{font-family:var(--sans);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--mut);padding:0 var(--s5) var(--s3)}
.railitem{display:flex;align-items:baseline;gap:var(--s3);width:100%;text-align:left;
  font-family:var(--sans);font-size:14px;font-weight:500;color:var(--mut);
  background:none;border:none;border-left:3px solid transparent;cursor:pointer;
  padding:10px var(--s5);transition:color .16s,background .16s,border-color .16s}
.railitem:hover{color:var(--navy);background:rgba(201,162,39,.07)}
.railitem.on{color:var(--navy);font-weight:700;background:var(--gold-soft);border-left-color:var(--gold)}
.railitem .rc{font-family:var(--sans);font-size:11px;color:var(--mut);margin-left:auto;font-weight:400}
.railitem.on .rc{color:var(--gold-dim)}
.subrail{margin:2px 0 var(--s4)}
.subrail .railitem{font-size:13.5px;padding-left:calc(var(--s5) + 14px)}
.railfoot{margin-top:auto;padding:var(--s5) var(--s5) 0;border-top:1px solid var(--line)}
.railfoot p{font-family:var(--serif);font-size:13.5px;font-style:italic;color:var(--navy);
  margin:var(--s4) 0 6px;line-height:1.45}
.railfoot span{font-family:var(--sans);font-size:10.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--mut)}

.main{flex:1;min-width:0}
.page{max-width:var(--measure);margin:0 auto;padding:var(--s7) var(--s6) var(--s8)}
.page.wide{max-width:1420px}

/* ---- cabe\xE7alho de p\xE1gina ---- */
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;
  gap:var(--s5);flex-wrap:wrap;padding-bottom:var(--s4);
  border-bottom:1px solid var(--line);margin-bottom:var(--s6)}
.eyebrow{font-family:var(--sans);font-size:11px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--gold);margin-bottom:var(--s2)}
h1.h1{font-family:var(--serif);font-size:34px;line-height:1.12;font-weight:700;
  color:var(--navy);margin:0;letter-spacing:-.01em}
.lede{font-family:var(--serif);font-size:17px;line-height:1.65;color:var(--mut);
  max-width:74ch;margin:0 0 var(--s6)}

/* ---- bot\xF5es ---- */
.btn{font-family:var(--sans);font-size:14px;font-weight:600;cursor:pointer;
  padding:11px 22px;border-radius:6px;background:var(--navy);color:#fff;
  border:1px solid var(--navy);transition:background .16s,transform .12s,box-shadow .16s;white-space:nowrap}
.btn:hover{background:var(--navy-2);box-shadow:var(--shadow)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--navy)}
.btn.ghost:hover{background:rgba(14,42,71,.06);box-shadow:none}
.btn.sm{font-size:12.5px;padding:7px 14px}

.chip{font-family:var(--sans);font-size:12.5px;font-weight:600;cursor:pointer;
  padding:6px 14px;border-radius:999px;background:transparent;color:var(--navy);
  border:1px solid var(--gold);margin:0 6px 6px 0;transition:background .16s,color .16s}
.chip:hover{background:var(--gold-soft)}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}

.tlink{font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--gold-dim);
  background:none;border:none;cursor:pointer;padding:4px 0;display:inline-flex;
  align-items:center;gap:5px;transition:color .16s}
.tlink:hover{color:var(--navy)}
.tlink-arrow{display:inline-block;transition:transform .2s}
.tlink:hover .tlink-arrow{transform:translateX(3px)}

/* ---- pain\xE9is e campos ---- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:26px}
.campo{margin-bottom:var(--s4)}
.lbl{font-family:var(--sans);font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--mut);margin-bottom:7px;line-height:1.45}
.inp{width:100%;padding:12px 14px;font-family:var(--serif);font-size:16.5px;line-height:1.6;
  color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:7px;
  transition:border-color .16s,box-shadow .16s;resize:vertical}
.inp:hover{border-color:#CFC7B2}
.inp:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,39,.13)}
.inp::placeholder{color:#A9B2BC;font-style:italic}

/* ---- grade de projetos ---- */
.grid{display:grid;gap:var(--s4);grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:24px;cursor:pointer;text-align:left;width:100%;
  display:flex;flex-direction:column;gap:var(--s4);
  transition:border-color .18s,box-shadow .18s,transform .18s}
.pcard:hover{border-color:var(--gold);box-shadow:var(--shadow-up);transform:translateY(-2px)}
.pcard-t{font-family:var(--serif);font-size:20px;font-weight:700;color:var(--navy);
  line-height:1.25;margin:0}
.pcard-m{font-family:var(--sans);font-size:12.5px;color:var(--mut);line-height:1.5}
.pcard-b{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s4);margin-top:auto}
.pct{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--gold);line-height:1;text-align:right}
.pct small{display:block;font-family:var(--sans);font-size:10.5px;font-weight:400;
  letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin-top:4px}

/* ---- medidor de prepara\xE7\xE3o por bloco do caderno ---- */
.gauge{display:flex;gap:3px;align-items:flex-end;flex:1}
.gauge .seg{flex:1;min-width:10px;height:28px;background:#EDE8DA;border-radius:2px;
  position:relative;overflow:hidden}
.gauge .seg i{position:absolute;left:0;right:0;bottom:0;background:var(--gold);
  transition:height .35s cubic-bezier(.4,0,.2,1)}
.gauge.lg .seg{height:44px}
.gaugekey{display:flex;gap:3px;margin-top:7px}
.gaugekey span{flex:1;min-width:10px;font-family:var(--sans);font-size:9.5px;
  letter-spacing:.02em;text-transform:uppercase;color:var(--mut);text-align:center;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---- estado vazio ---- */
.empty{border:1px dashed #CFC7B2;border-radius:10px;padding:var(--s8) var(--s6);
  text-align:center;background:rgba(255,255,255,.55)}
.empty h3{font-family:var(--serif);font-size:21px;color:var(--navy);margin:0 0 var(--s2)}
.empty p{font-family:var(--serif);font-size:15px;color:var(--mut);margin:0 auto var(--s5);max-width:44ch;line-height:1.6}

/* ---- cart\xF5es de teoria ---- */
.tcard{background:var(--card);border:1px solid var(--line);border-left:3px solid transparent;
  border-radius:8px;padding:20px 24px;margin-bottom:10px;cursor:pointer;width:100%;text-align:left;
  transition:border-color .18s,box-shadow .18s}
.tcard:hover{border-left-color:var(--gold);box-shadow:var(--shadow)}
.tcard.open{border-left-color:var(--gold);box-shadow:var(--shadow)}
.secmark{font-family:var(--sans);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--gold);border-bottom:1px solid var(--line);padding-bottom:8px;margin:var(--s6) 0 var(--s4)}

/* ---- utilit\xE1rios ---- */
h2.h2{font-family:var(--serif);font-size:22px;font-weight:700;color:var(--navy);margin:0 0 10px;line-height:1.25}
.sub{font-family:var(--serif);font-size:16.5px;color:var(--mut);line-height:1.65;margin:0 0 var(--s5);max-width:78ch;text-align:justify;hyphens:auto}
.stack>*+*{margin-top:var(--s4)}


/* ---- prosa: medida editorial, maior e justificada ---- */
.prose{font-family:var(--serif);font-size:17px;line-height:1.68;color:var(--ink);
  text-align:justify;text-justify:inter-word;hyphens:auto;-webkit-hyphens:auto;margin:0}
.prose+.prose{margin-top:14px}
.tbody{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,.8fr);
  gap:var(--s6);align-items:start;margin-top:18px}
.tbody .fullspan{grid-column:1/-1}
.gloss{background:var(--gold-soft);border-left:3px solid var(--gold);border-radius:0 7px 7px 0;
  padding:16px 18px;font-family:var(--serif);font-size:15.5px;line-height:1.62;color:var(--ink)}
.gloss b{display:block;font-family:var(--sans);font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--gold-dim);margin-bottom:7px}
@media (max-width:1180px){
  .tbody{grid-template-columns:1fr;gap:var(--s4)}
}

/* ---- caderno: campos em duas colunas em telas largas ---- */
.campos{display:grid;grid-template-columns:repeat(auto-fit,minmax(430px,1fr));
  gap:0 var(--s6)}
.campos .campo{margin-bottom:var(--s5)}
@media (max-width:900px){ .campos{grid-template-columns:1fr} }

/* ---- zona de exclus\xE3o ---- */
.danger{margin-top:var(--s5);padding-top:var(--s5);border-top:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:var(--s4);flex-wrap:wrap}
.danger p{font-family:var(--sans);font-size:12.5px;color:var(--mut);margin:0;max-width:52ch;line-height:1.5}
.btn.warn{background:transparent;color:#9C3F2E;border-color:#D8B4AB}
.btn.warn:hover{background:#FBEDE9;box-shadow:none}
.btn.warn.armed{background:#9C3F2E;color:#fff;border-color:#9C3F2E}
.pcard-x{position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:6px;
  border:none;background:transparent;color:#A9B2BC;font-size:17px;line-height:1;cursor:pointer;
  opacity:0;transition:opacity .16s,background .16s,color .16s}
.pcard{position:relative}
.pcard:hover .pcard-x{opacity:1}
.pcard-x:hover{background:#FBEDE9;color:#9C3F2E}
.pcard-x.armed{opacity:1;background:#9C3F2E;color:#fff;width:auto;padding:0 10px;font-family:var(--sans);font-size:11px;font-weight:700}

/* ---- responsivo ---- */
@media (max-width:1080px){
  :root{--rail:212px}
  .page{padding:var(--s6) var(--s5) var(--s7)}
  h1.h1{font-size:29px}
}
@media (max-width:820px){
  .topbar{padding:var(--s3) var(--s4);gap:var(--s3);flex-wrap:wrap}
  .ver{display:none}
  .shell{display:block}
  .rail{width:auto;flex:none;border-right:none;border-bottom:1px solid var(--line);
    flex-direction:row;overflow-x:auto;padding:0;scrollbar-width:none}
  .rail::-webkit-scrollbar{display:none}
  .railhead,.railfoot{display:none}
  .rail>div{display:flex}
  .subrail{margin:0}
  .railitem{width:auto;white-space:nowrap;border-left:none;border-bottom:3px solid transparent;
    padding:13px var(--s4)}
  .railitem.on{border-left-color:transparent;border-bottom-color:var(--gold);background:transparent}
  .railitem:hover{background:transparent}
  .railitem .rc{margin-left:6px}
  .subrail .railitem{padding-left:var(--s4)}
  .grid{grid-template-columns:1fr}
  .page{padding:var(--s5) var(--s4) var(--s7)}
  h1.h1{font-size:25px}
  .pagehead{align-items:flex-start;flex-direction:column;gap:var(--s4)}
  .panel{padding:20px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
@media print{
  .topbar,.rail,.so-tela{display:none!important}
  .shell{display:block}
  .page{max-width:none;padding:0}
  .panel{border:none;padding:0}
  body{background:#fff}
}
