0E2A47",fundo:"#E8EDF3",desc:"A TAESA opera isto diretamente em projetos de PDI."},modulo3:{rot:"Rota do M\xF3dulo 3",curto:"M\xF3dulo 3",cor:"#8A6D1D",fundo:"#F1E8CB",desc:"Aplic\xE1vel se a rota \u201Cstartups como instrumento de inova\xE7\xE3o\u201D do M\xF3dulo 3 do PROPDI for utilizada."},leitura:{rot:"Leitura do outro lado",curto:"Leitura",cor:"#5A6B7C",fundo:"#EEF1F4",desc:"N\xE3o \xE9 opera\xE7\xE3o da TAESA: serve para entender a contraparte e avaliar risco."}},Bt=[{t:"Power Law",sub:"lei de pot\xEAncia",pos:["leitura"],mercado:"O retorno do fundo depende de uma \xFAnica empresa excepcional; empresas \u201Capenas boas\u201D n\xE3o interessam.",taesa:"N\xE3o se aplica ao portf\xF3lio pr\xF3prio: o retorno \xE9 capacidade tecnol\xF3gica, resultado de projeto e conformidade. Indispens\xE1vel, por\xE9m, como lente para explicar a urg\xEAncia e a ambi\xE7\xE3o da startup."},{t:"Limited Partner e General Partner",sub:"investidor do fundo e gestor do fundo",pos:["leitura"],mercado:"Quem entrega o capital e quem o administra. O gestor ganha sobretudo pelo carried interest \u2014 a fatia do lucro do fundo, tipicamente 20%.",taesa:"A TAESA n\xE3o ocupa nenhuma das duas posi\xE7\xF5es. O conceito serve para identificar quem pressiona a startup por tr\xE1s dela \u2014 e por qu\xEA."},{t:"Rel\xF3gio do fundo",pos:["leitura"],mercado:"Vida de cerca de dez anos; nos anos 8 e 9 surge urg\xEAncia por venda ou liquidez.",taesa:"O rel\xF3gio da TAESA \xE9 o ciclo do projeto e da presta\xE7\xE3o de contas (M\xF3dulo 5 do PROPDI). O rel\xF3gio do fundo da parceira \xE9 risco de descontinuidade a mapear na avalia\xE7\xE3o pr\xE9via."},{t:"Runway",sub:"autonomia de caixa",pos:["direta"],mercado:"Meses de sobreviv\xEAncia com o caixa atual; define o poder de barganha na mesa.",taesa:"Ferramenta direta de avalia\xE7\xE3o pr\xE9via: autonomia curta da parceira \xE9 risco de execu\xE7\xE3o do projeto \u2014 mitigar com marcos e pagamentos escalonados, n\xE3o explorar."},{t:"Pr\xE9-money, post-money e dilui\xE7\xE3o",pos:["modulo3","leitura"],mercado:"Valor da empresa antes e depois do aporte, e o encolhimento percentual dos s\xF3cios existentes.",taesa:"Leitura do quadro societ\xE1rio da parceira; opera\xE7\xE3o apenas se a rota \u201Cstartups\u201D do M\xF3dulo 3 for utilizada, dentro das regras do PROPDI."},{t:"Employee Stock Option Pool",sub:"pool de participa\xE7\xE3o reservado a funcion\xE1rios",pos:["leitura"],mercado:"Participa\xE7\xE3o futura usada para atrair e reter equipe; a escolha entre cri\xE1-lo antes ou depois do aporte transfere valor silenciosamente.",taesa:"Sinal de leitura: a exist\xEAncia do pool indica capacidade de reter a equipe t\xE9cnica que executar\xE1 o seu projeto."},{t:"Term sheet",sub:"carta de inten\xE7\xF5es",pos:["direta"],mercado:"Documento de duas ou tr\xEAs p\xE1ginas que molda o contrato definitivo; renegociar depois \xE9 caro.",taesa:"An\xE1logo funcional: a proposta de projeto de PDI submetida cumpre papel semelhante \u2014 define o molde antes do instrumento jur\xEDdico."},{t:"Liquidation preference",sub:"prefer\xEAncia de liquida\xE7\xE3o",pos:["leitura"],mercado:"Ordem e m\xFAltiplo de recebimento na venda da empresa; decide quem fica com quanto nas sa\xEDdas moderadas.",taesa:"Nunca ser\xE1 cl\xE1usula da TAESA num projeto de PDI. No quadro societ\xE1rio da parceira, prefer\xEAncias agressivas significam fundador desmotivado \u2014 risco de execu\xE7\xE3o no m\xE9dio prazo."},{t:"Anti-dilui\xE7\xE3o, na forma full ratchet",sub:"reajuste integral do pre\xE7o de convers\xE3o",pos:["leitura"],mercado:"Protege o investidor anterior quando a empresa capta a um valor menor; na forma integral, transfere toda a dilui\xE7\xE3o aos fundadores.",taesa:"Sinal amarelo duplo na parceira: investidor transacional e bomba-rel\xF3gio societ\xE1ria que pode explodir durante o seu cronograma."},{t:"Vesting e cliff",sub:"aquisi\xE7\xE3o gradual e car\xEAncia inicial",pos:["leitura"],mercado:"Participa\xE7\xE3o conquistada ao longo do tempo \u2014 padr\xE3o de quatro anos, com car\xEAncia de doze meses; amarra os fundadores.",taesa:"Pergunta obrigat\xF3ria na avalia\xE7\xE3o pr\xE9via: sem esse mecanismo, o s\xF3cio-chave pode sair no m\xEAs seis levando o conhecimento cr\xEDtico do projeto."},{t:"Cl\xE1usulas de controle: assentos no conselho e vetos",pos:["leitura"],mercado:"Definem quem decide de fato, para al\xE9m do percentual de participa\xE7\xE3o.",taesa:"Mapeamento de mandato: um investidor com veto amplo pode travar a parceria sem sentar \xE0 mesa. Descobrir antes de negociar, n\xE3o na assinatura."},{t:"Tag along, drag along e direito de prefer\xEAncia",sub:"venda conjunta, arrasto e right of first refusal",pos:["leitura"],mercado:"Direitos que regulam sa\xEDdas entre s\xF3cios: acompanhar a venda, arrastar os demais, ou igualar oferta de terceiro.",taesa:"Leitura de liquidez e de quem pode arrastar a empresa no meio do projeto; direito de prefer\xEAncia amplo sobre a tecnologia afeta o resultado do PDI."},{t:"Nota convers\xEDvel e SAFE",sub:"acordo simplificado de participa\xE7\xE3o futura",pos:["modulo3","leitura"],mercado:"Instrumentos que adiam a discuss\xE3o de valor at\xE9 haver informa\xE7\xE3o; teto de valuation e desconto compensam quem entrou cedo.",taesa:"Mesma filosofia do contrato adaptativo j\xE1 praticado em PDI; opera\xE7\xE3o direta apenas na rota do M\xF3dulo 3."},{t:"Tranches e marcos",pos:["direta"],mercado:"Aporte parcelado, liberado por entrega verific\xE1vel \u2014 a l\xF3gica das op\xE7\xF5es reais.",taesa:"Equival\xEAncia plena: \xE9 a execu\xE7\xE3o por etapas com marcos de maturidade tecnol\xF3gica (escala TRL, de 1 a 9) que o M\xF3dulo 4 do PROPDI j\xE1 exige. Mesmo m\xE9todo, outro nome."},{t:"Corporate Venture Capital e o \u201Cabra\xE7o de urso\u201D",sub:"investimento corporativo em startups",pos:["direta","modulo3"],mercado:"Corpora\xE7\xE3o, e n\xE3o fundo financeiro, investindo em startup: retorno financeiro e estrat\xE9gico, com riscos de sufocamento da parceira.",taesa:"A posi\xE7\xE3o mais pr\xF3xima da TAESA \u2014 com um bra\xE7o a mais no abra\xE7o: recursos regulados, divulga\xE7\xE3o p\xFAblica do portf\xF3lio e destino pr\xF3prio das receitas de explora\xE7\xE3o (M\xF3dulo 6 do PROPDI)."},{t:"Exit",sub:"evento de liquidez",pos:["leitura"],mercado:"Venda, fus\xE3o ou abertura de capital em bolsa \u2014 o objetivo final do fundo.",taesa:"O desfecho buscado pela TAESA \xE9 outro: tecnologia validada, capacidade incorporada e resultado reconhecido. O evento de liquidez da parceira, por\xE9m, pode atravessar o seu cronograma."}],Bm=["A coluna \u201CNa realidade da TAESA\u201D n\xE3o afirma norma al\xE9m do que o M\xF3dulo 3 do PROPDI nomeia expressamente \u2014 startups como instrumento de inova\xE7\xE3o, em modalidade afim e complementar \xE0s obriga\xE7\xF5es do programa. Condi\xE7\xF5es, limites e reconhecimento de gastos seguem os m\xF3dulos pr\xF3prios.","Os enquadramentos de risco \u2014 autonomia de caixa curta, aus\xEAncia de aquisi\xE7\xE3o gradual de participa\xE7\xE3o, reajuste integral do pre\xE7o de convers\xE3o \u2014 seguem a postura do guia: fragilidade da contraparte \xE9 risco a mitigar no contrato, n\xE3o vantagem a explorar."],ka=[{id:"desafio",t:"Escolha do desafio",curto:"Desafio",sub:"Primeiro passo: definir sobre o que voc\xEAs v\xE3o trabalhar.",teoria:"dimensoes",itens:[{tipo:"guia",t:"Desafios publicados",txt:"Entre os desafios de inova\xE7\xE3o divulgados pelo TAESA Ventures est\xE3o, por exemplo: religamento autom\xE1tico com intelig\xEAncia adaptativa; reconhecimento automatizado de componentes de linhas de transmiss\xE3o e equipamentos; inspe\xE7\xE3o de ativos por drones; integra\xE7\xE3o das ferramentas de gest\xE3o de seguran\xE7a do trabalho; tecnologias para obras de infraestrutura e atividades de O&M; concilia\xE7\xE3o automatizada de documentos e informa\xE7\xF5es da \u201Craz\xE3o obra\u201D; dilig\xEAncia t\xE9cnica em processos de aquisi\xE7\xE3o de empreendimentos. Confiram a lista completa e atualizada no site antes de escolher."},{tipo:"q",id:"d1",n:1,q:"Desafio escolhido pelo grupo",ex:"inspe\xE7\xE3o de ativos por drones"},{tipo:"q",id:"d2",n:2,q:"Por que este? (relev\xE2ncia para a \xE1rea de voc\xEAs)",ex:"\xE9 o desafio com maior impacto direto na rotina de manuten\xE7\xE3o de linhas"},{tipo:"guia",t:"O que considerar ao responder",txt:"O enunciado do desafio: qual \xE9 exatamente o problema que a TAESA quer resolver? Que resultado caracterizaria sucesso \u2014 e como ele seria medido? Que \xE1reas internas s\xE3o afetadas pela solu\xE7\xE3o (opera\xE7\xE3o, manuten\xE7\xE3o, TI, seguran\xE7a, jur\xEDdico, regulat\xF3rio)? Que etapa de desenvolvimento est\xE1 em jogo agora: prova de conceito, execu\xE7\xE3o e piloto, inser\xE7\xE3o no mercado, fornecimento ou explora\xE7\xE3o comercial? Como a TAESA resolve isso hoje, e quanto custa o m\xE9todo atual \u2014 ainda que aproximadamente. Que tipo de proponente tende a se candidatar: startup pequena, empresa estabelecida, ICT, universidade, cons\xF3rcio?"},{tipo:"q",id:"d3",n:3,q:"Resumo do desafio, em cinco linhas, escrito por voc\xEAs",ex:"descrevam o problema, o resultado esperado, como \xE9 resolvido hoje e o que mudaria",rows:6},{tipo:"guia",t:"A pauta j\xE1 est\xE1 publicada",txt:"Os crit\xE9rios de avalia\xE7\xE3o divulgados pelo programa incluem problema, solu\xE7\xE3o com foco em resultados, experi\xEAncia da equipe, mercado, est\xE1gio atual do produto, custos \u2014 desembolso, contrapartida e royalties \u2014 e alinhamento com o modelo Venture Client. Esses s\xE3o, na pr\xE1tica, os itens que estar\xE3o sobre a mesa. Somem a eles: propriedade intelectual, exclusividade, prazos, marcos de pagamento e condi\xE7\xF5es para a etapa seguinte."}]},{id:"pessoas",t:"Pessoas",curto:"Pessoas",sub:"Quem est\xE1 na mesa, quem est\xE1 acima dela e quem est\xE1 fora \u2014 mas pode influir.",teoria:"dimensoes",itens:[{tipo:"q",id:"p1",n:1,q:"Quem estar\xE1 na mesa de negocia\xE7\xF5es?",ex:"n\xF3s, da \xE1rea de inova\xE7\xE3o, com um especialista t\xE9cnico da \xE1rea demandante; do outro lado, o fundador e um engenheiro da proponente"},{tipo:"q",id:"p2",n:2,q:"Quem est\xE1 acima dos negociadores, com influ\xEAncia na negocia\xE7\xE3o?",ex:"a diretoria, que aprova valores acima da al\xE7ada; o comit\xEA que prioriza o portf\xF3lio de inova\xE7\xE3o"},{tipo:"q",id:"p3",n:3,q:"Quem n\xE3o est\xE1 nem ao redor da mesa, nem acima dos negociadores, mas pode vir a ter participa\xE7\xE3o na negocia\xE7\xE3o?",ex:"a equipe de campo que vai conviver com a solu\xE7\xE3o; o jur\xEDdico, por causa de dados e propriedade intelectual; o regulat\xF3rio, pelo enquadramento do projeto"},{tipo:"guia",t:"Ao responder, anote tamb\xE9m",txt:"Para cada nome: o que essa pessoa quer, o que ela teme e como tratar isso sem ceder na subst\xE2ncia. Seja duro na quest\xE3o e suave com a pessoa."}]},{id:"problemas",t:"Problemas",curto:"Problemas",sub:"O que est\xE1 em jogo, que solu\xE7\xF5es existem, o que as sustenta e qual \xE9 o plano B.",teoria:"harvard",itens:[{tipo:"q",id:"q1",n:1,q:"Quais s\xE3o os objetivos, as prioridades, as necessidades e as motiva\xE7\xF5es a serem cumpridas?",ex:"reduzir o tempo entre inspe\xE7\xE3o e laudo, aumentar a frequ\xEAncia sem elevar custo, e n\xE3o desorganizar a rotina das equipes de campo"},{tipo:"guia",t:"Fa\xE7am duas colunas mentais",txt:"Os nossos objetivos, com fatos. E os da outra parte, como hip\xF3tese. Marquem com \u201C?\u201D o que for suposi\xE7\xE3o \u2014 cada \u201C?\u201D vira uma pergunta a fazer na mesa. Posi\xE7\xE3o \xE9 o que a pessoa quer; interesse \xE9 por que ela quer."},{tipo:"q",id:"q2",n:2,q:"Quais solu\xE7\xF5es poderiam satisfaz\xEA-los na mesa?",ex:"piloto em trecho reduzido com marcos de libera\xE7\xE3o; contrapartida em treinamento das equipes; royalties escalonados conforme resultado medido"},{tipo:"guia",t:"Uma pergunta que melhora as solu\xE7\xF5es",txt:"Que capacidade este projeto constr\xF3i? Em V = C \xD7 (A + P), se a capacidade \xE9 zero o valor \xE9 zero: contratar servi\xE7o sem desenvolver compet\xEAncia nova n\xE3o deixa nada dur\xE1vel. Solu\xE7\xF5es que constroem capacidade costumam acessar or\xE7amentos, prazos e aprova\xE7\xF5es diferentes."},{tipo:"q",id:"q3",n:3,q:"Quais justificativas poderiam apoiar as solu\xE7\xF5es que eu quero manter no neg\xF3cio?",ex:"custo do m\xE9todo atual por unidade inspecionada; preju\xEDzo evitado por falha detectada com anteced\xEAncia; pre\xE7o praticado por solu\xE7\xF5es equivalentes no mercado"},{tipo:"guia",t:"Cuidado com a compara\xE7\xE3o",txt:"Dois n\xFAmeros s\xF3 se comparam se medirem o mesmo escopo. Antes de usar um custo como argumento, confiram o que ele inclui e o que deixa de fora."},{tipo:"q",id:"q4",n:4,q:"Qual \xE9 o meu plano B caso as negocia\xE7\xF5es parem?",ex:"seguir com o m\xE9todo atual mais um ciclo e reabrir o desafio na pr\xF3xima rodada; ou negociar com outro proponente da mesma chamada"},{tipo:"nota",txt:"Esta pergunta abre o Bloco 4 \u2014 a an\xE1lise da BATNA."}]},{id:"processo",t:"Processo",curto:"Processo",sub:"Como a negocia\xE7\xE3o vai acontecer \u2014 a dimens\xE3o mais esquecida e a mais barata de preparar.",teoria:"precee",itens:[{tipo:"q",id:"r1",n:1,q:"Como organizamos a negocia\xE7\xE3o?",ex:"abrimos n\xF3s, com agenda em tr\xEAs blocos: escopo t\xE9cnico, marcos e etapas, e s\xF3 ent\xE3o custos",rows:6},{tipo:"guia",t:"O que considerar ao responder",txt:"Quem abre a conversa \u2014 n\xF3s ou eles? Quem fala por n\xF3s em cada tema? Quantas rodadas prevemos, e qual \xE9 o objetivo de cada uma? Agenda: em que ordem os temas entram? Come\xE7amos pelos pontos f\xE1ceis, para criar acordo, ou pelos dif\xEDceis, enquanto h\xE1 energia? Custos entram quando? Antes ou depois de fecharmos o entendimento t\xE9cnico? Formato: presencial ou remoto, quanto tempo, com quantas pessoas de cada lado? Quem aprova o que combinarmos, do nosso lado \u2014 e em quanto tempo? Prazo: temos data-limite (ciclo or\xE7ament\xE1rio, janela de submiss\xE3o)? Ela \xE9 conhecida pela outra parte? Deveria ser?"},{tipo:"q",id:"r2",n:2,q:"Como processamos a troca de informa\xE7\xF5es?",ex:"o escopo t\xE9cnico e as restri\xE7\xF5es de dados saem cedo; a al\xE7ada de aprova\xE7\xE3o n\xE3o sai",rows:6},{tipo:"guia",t:"O que considerar ao responder",txt:"O que revelamos \u2014 e em que momento da conversa? O que n\xE3o revelamos em hip\xF3tese alguma? O que precisamos obter deles, e quem faz cada pergunta? Quem toma nota do que for dito, e como conferimos ao final de cada rodada? O que exigimos por escrito antes de avan\xE7ar (proposta formal, minuta, confidencialidade)? Como validamos o que eles afirmarem \u2014 d\xE1 para pedir evid\xEAncia, refer\xEAncia de cliente ou demonstra\xE7\xE3o? Pausa: combinamos que qualquer um dos lados pode pedir intervalo para conferenciar?"},{tipo:"q",id:"r3",n:3,q:"Quais quest\xF5es log\xEDsticas precisam ser resolvidas na negocia\xE7\xE3o?",ex:"acordo de confidencialidade assinado antes da reuni\xE3o t\xE9cnica; demonstra\xE7\xE3o em campo com data e local definidos",rows:6},{tipo:"guia",t:"O que considerar ao responder",txt:"Data, hora, dura\xE7\xE3o e local de cada encontro \u2014 e quem convoca. Documentos prontos antes: enunciado do desafio, minuta contratual, termo de confidencialidade, planilha de custos. Materiais de apoio: dados, laudos, refer\xEAncias e demonstra\xE7\xF5es que vamos levar ou pedir. Quem redige a ata ou o resumo do acordado \u2014 e em quantos dias circula. Quem assina o acordo final, e que ritos internos ele precisa cumprir antes. Canais: por onde a conversa continua entre as rodadas."}]},{id:"batna",t:"Analise e defina sua BATNA",curto:"BATNA",sub:"Sua melhor alternativa caso n\xE3o haja acordo.",teoria:"posicao",itens:[{tipo:"q",id:"b1",n:1,q:"Quais s\xE3o suas alternativas se a negocia\xE7\xE3o encerrar sem um acordo?",ex:"manter o m\xE9todo atual; reabrir o desafio na pr\xF3xima rodada; negociar com outro proponente; desenvolver internamente",rows:5},{tipo:"q",id:"b2",n:2,q:"Dessa lista, qual \xE9 sua melhor alternativa?",ex:"negociar com o segundo colocado da mesma chamada \u2014 mas o cronograma atrasa um ciclo"},{tipo:"num",n:3,t:"Voc\xEA consegue melhorar sua BATNA?"},{tipo:"sub",id:"b3a",q:"Existe algum acordo que voc\xEA possa fazer com outros clientes ou fornecedores que venha a melhorar sua BATNA?",ex:"qualificar em paralelo um segundo proponente da mesma chamada, para n\xE3o dependermos de um \xFAnico parceiro"},{tipo:"sub",id:"b3b",q:"H\xE1 alguma maneira de retirar ou de alterar qualquer limita\xE7\xE3o que neste momento enfraque\xE7a sua BATNA? Em caso afirmativo, qual seria? Como?",ex:"a limita\xE7\xE3o \xE9 o calend\xE1rio: se antecip\xE1ssemos a aprova\xE7\xE3o interna, poder\xEDamos esperar a pr\xF3xima rodada sem perder o ciclo"},{tipo:"sub",id:"b3c",q:"H\xE1 alguma maneira de alterar os termos da negocia\xE7\xE3o de modo a melhorar sua BATNA? Em caso afirmativo, qual seria? Como?",ex:"dividir o desafio em duas frentes contrat\xE1veis separadamente reduz nossa depend\xEAncia de um \xFAnico fornecedor"},{tipo:"q",id:"b4",n:4,q:"Qual ser\xE1 sua nova BATNA se voc\xEA conseguir melhor\xE1-la?",ex:"com dois proponentes qualificados em paralelo, deixamos de depender de um \xFAnico parceiro"}]},{id:"desistencia",t:"Determine sua posi\xE7\xE3o de desist\xEAncia",curto:"Desist\xEAncia",sub:"O ponto menos favor\xE1vel at\xE9 o qual voc\xEA ainda aceita um acordo.",teoria:"posicao",itens:[{tipo:"num",n:1,t:"Explorar as vari\xE1veis que afetam sua posi\xE7\xE3o de desist\xEAncia."},{tipo:"sub",id:"s1a",q:"Qual voc\xEA acredita que seja atualmente o ponto menos favor\xE1vel segundo o qual voc\xEA aceitaria negociar um acordo?",ex:"um piloto dentro da al\xE7ada da \xE1rea, com laudo entregue em prazo menor que o atual e propriedade dos dados conosco"},{tipo:"sub",id:"s1b",q:"Como ele se compara \xE0 sua BATNA? (Sua posi\xE7\xE3o de desist\xEAncia deve representar pelo menos uma pequena melhoria em rela\xE7\xE3o \xE0 sua BATNA.)",ex:"nossa BATNA \xE9 manter o m\xE9todo atual por mais um ciclo; ent\xE3o o acordo precisa entregar, no m\xEDnimo, redu\xE7\xE3o de prazo \u2014 sen\xE3o n\xE3o vale fechar"},{tipo:"sub",id:"s1c",q:"Que outras vari\xE1veis voc\xEA precisa considerar?",ex:"janela do ciclo or\xE7ament\xE1rio, disponibilidade da equipe de campo e as exig\xEAncias do jur\xEDdico sobre dados"},{tipo:"sub",id:"s1d",q:"Se a negocia\xE7\xE3o envolver dinheiro, qual \xE9 o valor mais baixo / mais alto que voc\xEA consideraria?",ex:"teto na al\xE7ada da \xE1rea \u2014 acima disso o prazo de aprova\xE7\xE3o da diretoria inviabiliza o cronograma"},{tipo:"sub",id:"s1e",q:"Quais s\xE3o as condi\xE7\xF5es m\xEDnima / m\xE1xima n\xE3o monet\xE1rias que voc\xEA consideraria? (prazo, propriedade intelectual, exclusividade, contrapartida, royalties, direito de divulga\xE7\xE3o)",ex:"m\xEDnimo: propriedade dos dados operacionais e laudo em formato integr\xE1vel aos nossos sistemas. M\xE1ximo: exclusividade regional por 12 meses"},{tipo:"num",n:2,t:"Avaliar os trade-offs entre suas quest\xF5es e interesses."},{tipo:"sub",id:"s2a",q:"Em que quest\xF5es ou condi\xE7\xF5es voc\xEA est\xE1 mais interessado? E menos interessado?",ex:"mais: prazo do laudo e propriedade dos dados. Menos: marca do equipamento e o modelo de contrata\xE7\xE3o da equipe deles"},{tipo:"sub",id:"s2b",q:"Algumas dessas condi\xE7\xF5es ou quest\xF5es est\xE3o relacionadas entre si? (Ou seja, mais ou menos do que voc\xEA deseja em um ponto d\xE1 a voc\xEA mais ou menos flexibilidade sobre algum outro?) Em caso afirmativo, quais?",ex:"aceitar prazo maior de execu\xE7\xE3o nos d\xE1 margem para exigir mais marcos de valida\xE7\xE3o intermedi\xE1ria"},{tipo:"sub",id:"s2c",q:"At\xE9 que ponto voc\xEA aceita negociar ou trocar uma determinada quest\xE3o ou condi\xE7\xE3o?",ex:"royalties s\xE3o negoci\xE1veis se a propriedade do dado operacional ficar conosco; o inverso, n\xE3o"},{tipo:"sub",id:"s2d",q:"H\xE1 outros arranjos para o acordo que teriam valor equivalente para voc\xEA? Em caso afirmativo, mencione-os aqui.",ex:"em vez de reduzir o desembolso, contrapartida em treinamento da nossa equipe e integra\xE7\xE3o aos nossos sistemas"},{tipo:"num",n:3,t:"Considerando suas respostas acima, determine sua posi\xE7\xE3o de desist\xEAncia."},{tipo:"sub",id:"s3",q:"Voc\xEA ent\xE3o poder\xE1 avaliar propostas alternativas em rela\xE7\xE3o a essa posi\xE7\xE3o de desist\xEAncia.",ex:"\u201Cabaixo de um piloto que reduza o prazo do laudo, mantenha os dados conosco e caiba na al\xE7ada da \xE1rea, n\xE3o fechamos: seguimos com o m\xE9todo atual e reabrimos o desafio na pr\xF3xima rodada.\u201D",rows:5},{tipo:"guia",t:"Confira antes de seguir",txt:"Ponha lado a lado o que voc\xEA escreveu no Bloco 4 e no item 3 acima, e responda: se eu assinar esse pior acordo, fico melhor do que se eu n\xE3o assinar nada e executar meu plano B? Se a resposta for \u201Cn\xE3o\u201D ou \u201Cd\xE1 na mesma\u201D, a posi\xE7\xE3o de desist\xEAncia est\xE1 no lugar errado. Ela precisa representar pelo menos uma pequena melhoria em rela\xE7\xE3o \xE0 BATNA \u2014 do contr\xE1rio, voc\xEA estaria fechando um acordo pior do que simplesmente n\xE3o fechar. Exemplo: voc\xEA vende um carro e j\xE1 tem outro comprador oferecendo R$ 40 mil, firme. Essa \xE9 a sua BATNA. Logo, sua posi\xE7\xE3o de desist\xEAncia n\xE3o pode ser R$ 38 mil \u2014 teria de ser algo acima de R$ 40 mil."}]},{id:"mesa",t:"A mesa",curto:"A mesa",sub:"O que fica definido antes de a conversa come\xE7ar.",teoria:"equacao",itens:[{tipo:"q",id:"m1",n:1,q:"Nossa frase de abertura (n\xE3o pode conter n\xFAmero)",ex:"\u201CAntes de falarmos de valores, queria entender como voc\xEAs enxergam esse problema e o que j\xE1 testaram.\u201D",rows:4},{tipo:"num",n:2,t:"O que cedemos e o que pedimos em troca"},{tipo:"nota",txt:"ex. ilustrativo: cedemos flexibilidade no cronograma e pedimos contrapartida em capacita\xE7\xE3o da nossa equipe."},{tipo:"tab",id:"trocas",cols:["O que cedemos (barato para n\xF3s, valioso para eles)","O que pedimos em troca"],chaves:["cede","pede"],linhas:4},{tipo:"num",n:3,t:"Quem participa por n\xF3s, e com que papel"},{tipo:"tab",id:"papeis",cols:["Papel","Nome"],chaves:["papel","nome"],linhas:4},{tipo:"guia",t:"Sugest\xE3o de pap\xE9is",txt:"L\xEDder (conduz e pergunta) \xB7 t\xE9cnico (viabilidade e escopo) \xB7 controller (guarda a posi\xE7\xE3o de desist\xEAncia e os n\xFAmeros)."}]},{id:"sintese",t:"S\xEDntese",curto:"S\xEDntese",sub:"Uma p\xE1gina para levar \xE0 reuni\xE3o.",teoria:"posicao",itens:[{tipo:"nota",txt:"Transcrevam aqui o essencial. Se voc\xEAs s\xF3 puderem levar uma folha para a mesa, \xE9 esta."},{tipo:"q",id:"y1",q:"Desafio e objetivo em uma frase"},{tipo:"q",id:"y2",q:"Nossos tr\xEAs interesses principais",rows:4},{tipo:"q",id:"y3",q:"As tr\xEAs perguntas que precisamos fazer",rows:4},{tipo:"q",id:"y4",q:"Nossa BATNA"},{tipo:"q",id:"y5",q:"Nossa posi\xE7\xE3o de desist\xEAncia"},{tipo:"q",id:"y6",q:"Nosso crit\xE9rio objetivo principal"},{tipo:"q",id:"y7",q:"O que cedemos primeiro, e contra o qu\xEA"}]}],Qt=ka.flatMap(e=>e.itens.filter(o=>o.tipo==="q"||o.tipo==="sub").map(o=>({bloco:e.id,id:o.id}))),gs=ka.reduce((e,o)=>(e[o.id]=o.itens.filter(a=>a.tipo==="q"||a.tipo==="sub").map(a=>a.id),e),{}),vr={t:"Como usar este caderno",intro:"Este caderno \xE9 um roteiro de prepara\xE7\xE3o. Voc\xEAs v\xE3o escolher um dos desafios de inova\xE7\xE3o publicados pelo TAESA Ventures e preparar, do come\xE7o ao fim, a negocia\xE7\xE3o com uma organiza\xE7\xE3o que se candidate a resolv\xEA-lo. A perspectiva \xE9 a do TAESA Ventures \u2014 voc\xEAs s\xE3o o lado que contrata. A outra parte \xE9 a startup, ICT, universidade ou empresa proponente.",ordem:[["Bloco 1 \u2014 Pessoas.","Quem decide, quem influencia, quem pode travar."],["Bloco 2 \u2014 Problemas.","Objetivos e interesses, solu\xE7\xF5es poss\xEDveis, justificativas e plano B."],["Bloco 3 \u2014 Processo.","Como a negocia\xE7\xE3o vai acontecer."],["Bloco 4 \u2014 BATNA.","Sua melhor alternativa caso n\xE3o haja acordo."],["Bloco 5 \u2014 Posi\xE7\xE3o de desist\xEAncia.","O ponto al\xE9m do qual n\xE3o vale fechar."],["Bloco 6 \u2014 A mesa.","Abertura, trocas e quem participa."]],orientacoes:[["Respostas curtas.","Um t\xF3pico por linha, n\xE3o par\xE1grafos."],["S\xF3 o que \xE9 p\xFAblico.","Usem o que est\xE1 publicado no site e o que voc\xEAs j\xE1 sabem do neg\xF3cio. Se algo for confidencial ou incerto, n\xE3o escrevam: anotem como pergunta a levar para a mesa."],["A linha em it\xE1lico \xE9 exemplo de formato,","sempre constru\xEDda sobre o desafio de inspe\xE7\xE3o por drones \u2014 sirvam-se dela como modelo, n\xE3o como resposta."]],fecho:"Ao final, voc\xEAs ter\xE3o um documento que serve para uma negocia\xE7\xE3o real \u2014 e um modelo reaproveit\xE1vel para as pr\xF3ximas."},$m=["Menor custo","Maior confiabilidade","Maior qualidade","Maior agilidade","Maior seguran\xE7a","Redu\xE7\xE3o de perdas"],Wt=["Co-investimento PDI (ANEEL)","Fornecedor / EPC","Parceria com universidade ou ICT","Outro"],hs=()=>{let e={};return Qt.forEach(o=>{e[o.id]=""}),{id:Date.now(),nome:"",contraparte:"",tipo:Wt[0],emJogo:"",caderno:e,tabelas:{trocas:Array.from({length:4},()=>({cede:"",pede:""})),papeis:Array.from({length:4},()=>({papel:"",nome:""}))},pessoas:[],vcap:{ativos:"",processos:"",capacidades:"",impactos:[],outros:"",sintese:""}}},vs=()=>{let e=hs();e.id=1,e.nome="Piloto de inspe\xE7\xE3o de linhas com drones",e.contraparte="DroneCheck",e.tipo=Wt[0],e.emJogo="Estruturar um projeto de PDI em co-investimento para validar inspe\xE7\xE3o aut\xF4noma de linhas de transmiss\xE3o com drones e vis\xE3o computacional. Um bom acordo garante car\xE1ter inovador defens\xE1vel no enquadramento PROPDI, propriedade dos dados brutos, marcos t\xE9cnicos por TRL com sa\xEDda limpa, e cronograma compat\xEDvel com o ciclo regulat\xF3rio.";let o={d1:"Inspe\xE7\xE3o de ativos por drones.",d2:"\xC9 o desafio de maior impacto direto na rotina de manuten\xE7\xE3o de linhas: hoje a inspe\xE7\xE3o depende de janela de equipe em campo, o que limita a frequ\xEAncia e exp\xF5e pessoas a risco em altura e em faixa de servid\xE3o de dif\xEDcil acesso.",d3:"Hoje a inspe\xE7\xE3o de cadeias de isoladores e ferragens \xE9 visual, tripulada e programada por calend\xE1rio. O intervalo entre a inspe\xE7\xE3o e o laudo \xE9 longo, a frequ\xEAncia \xE9 baixa e a cobertura por quil\xF4metro \xE9 cara. O resultado esperado \xE9 inspe\xE7\xE3o aut\xF4noma capaz de detectar anomalias com confiabilidade compar\xE1vel \xE0 tripulada, a custo por quil\xF4metro menor, com laudo em formato integr\xE1vel ao planejamento de manuten\xE7\xE3o. O que mudaria: a inspe\xE7\xE3o deixa de ser evento de calend\xE1rio e passa a ser rotina cont\xEDnua priorizada por criticidade do ativo \u2014 e a organiza\xE7\xE3o internaliza a capacidade de operar e auditar essa tecnologia.",p1:"Do nosso lado: gestora do programa de inova\xE7\xE3o (conduz) e engenheiro de manuten\xE7\xE3o de linhas (avalia viabilidade t\xE9cnica). Do lado da DroneCheck: os dois s\xF3cios-fundadores \u2014 o CTO, que responde pela tecnologia, e o CEO, que decide comercial.",p2:"Nosso diretor de opera\xE7\xF5es aprova o desembolso acima do teto da ger\xEAncia e assina o enquadramento do projeto. Na DroneCheck, h\xE1 um investidor anjo com assento de observador que n\xE3o senta \xE0 mesa, mas \xE9 consultado em cl\xE1usulas de propriedade intelectual. O comit\xEA de inova\xE7\xE3o prioriza o portf\xF3lio e define a janela or\xE7ament\xE1ria.",p3:"A equipe de manuten\xE7\xE3o, que defende internamente um contrato de servi\xE7o convencional com a VistaLinha e pode reabrir a discuss\xE3o no comit\xEA \u2014 quer previsibilidade e teme depender de tecnologia n\xE3o comprovada. A \xE1rea jur\xEDdica, que revisa a minuta e se preocupa com dados e propriedade intelectual. O regulat\xF3rio, que n\xE3o participa mas define o enquadramento \u2014 o que torna o car\xE1ter inovador requisito, n\xE3o prefer\xEAncia. E a equipe de campo, que vai conviver com a solu\xE7\xE3o e teme que ela seja apresentada como substitui\xE7\xE3o de pessoas.",q1:"Nossos objetivos, com fatos: validar em campo se a inspe\xE7\xE3o aut\xF4noma detecta anomalias em cadeias de isoladores com confiabilidade compar\xE1vel \xE0 tripulada; reduzir o custo por quil\xF4metro inspecionado; e internalizar a capacidade. Prioridades, em ordem: enquadramento PDI defens\xE1vel, propriedade dos dados, marcos verific\xE1veis, pre\xE7o. Hip\xF3tese sobre a outra parte (a confirmar na mesa): querem um contrato de refer\xEAncia com transmissora, que valida a tecnologia e serve de prova social na pr\xF3xima capta\xE7\xE3o \u2014 e provavelmente precisam de receita no curto prazo (?).",q2:"Piloto de seis meses em dois trechos de perfis distintos, com escopo fechado e op\xE7\xE3o de extens\xE3o. Compara\xE7\xE3o cega contra a inspe\xE7\xE3o convencional nos mesmos trechos, para gerar evid\xEAncia e n\xE3o impress\xE3o. Licen\xE7a de uso do modelo para nossa opera\xE7\xE3o, com a DroneCheck mantendo a propriedade do algoritmo e n\xF3s a dos dados coletados na nossa rede. Contrapartida n\xE3o monet\xE1ria: acesso a campo de teste, integra\xE7\xE3o aos nossos sistemas e carta de refer\xEAncia ao fim do piloto, se as metas forem atingidas. Royalties escalonados conforme resultado medido, em vez de desembolso maior \xE0 vista.",q3:"Custo do m\xE9todo atual por quil\xF4metro inspecionado, medido no mesmo escopo da proposta. Preju\xEDzo evitado por falha detectada com anteced\xEAncia, com base no hist\xF3rico de ocorr\xEAncias em cadeias de isoladores. Pre\xE7o praticado por solu\xE7\xF5es equivalentes no mercado, incluindo a proposta da VistaLinha. Or\xE7amento referenciado em projetos PDI an\xE1logos do setor, j\xE1 aprovados pelo regulador. Para o car\xE1ter inovador: o desenvolvimento de capacidade nova de inspe\xE7\xE3o preditiva cont\xEDnua \u2014 n\xE3o a substitui\xE7\xE3o de rotina remunerada pela RAP, que \xE9 exclus\xE3o expressa.",q4:"Desenvolver a capacidade por rota alternativa: o laborat\xF3rio da universidade parceira demonstrou prot\xF3tipo funcional de vis\xE3o computacional aplic\xE1vel ao mesmo problema. \xC9 tecnicamente vi\xE1vel, por\xE9m cerca de 40% mais caro, com 9 a 12 meses adicionais e sem hist\xF3rico de opera\xE7\xE3o em campo. Alternativa secund\xE1ria: seguir com o m\xE9todo atual mais um ciclo e reabrir o desafio na pr\xF3xima rodada.",r1:"Abrimos n\xF3s, com agenda publicada antes de cada encontro \u2014 quem organiza o processo conduz a mesa. Tr\xEAs rodadas com prop\xF3sito declarado: (1) t\xE9cnica, sem n\xFAmeros, para alinhar escopo, TRL de partida e crit\xE9rios de sucesso; (2) comercial, com proposta estruturada em tr\xEAs configura\xE7\xF5es de escopo e pre\xE7o; (3) fechamento, com a minuta j\xE1 revisada pelo jur\xEDdico. Custos entram apenas na segunda rodada, depois de fechado o entendimento t\xE9cnico. Formato: primeira presencial com visita a campo, as demais remotas de 90 minutos, no m\xE1ximo tr\xEAs pessoas por lado. Do nosso lado, a ger\xEAncia aprova at\xE9 o teto da al\xE7ada em cinco dias; acima disso, a diretoria leva cerca de tr\xEAs semanas. Temos data-limite pelo ciclo or\xE7ament\xE1rio \u2014 e ela n\xE3o ser\xE1 revelada.",r2:"Sai cedo: o escopo t\xE9cnico, a linha de base de custo por quil\xF4metro (informa\xE7\xE3o pouco sens\xEDvel) e as restri\xE7\xF5es de dados. N\xE3o sai em hip\xF3tese alguma: o teto or\xE7ament\xE1rio, a al\xE7ada de aprova\xE7\xE3o e o prazo interno do ciclo. Precisamos obter deles: estrutura de custos do piloto, relat\xF3rio do \xFAltimo piloto executado em outra transmissora com dados anonimizados, refer\xEAncia de cliente verific\xE1vel e composi\xE7\xE3o da equipe t\xE9cnica. O engenheiro faz as perguntas t\xE9cnicas; a gestora, as comerciais. Um integrante fica sem falar, apenas registrando o que a contraparte diz e as rea\xE7\xF5es. Ao final de cada rodada, conferimos em voz alta o que foi combinado e circulamos o resumo por escrito em dois dias. Exigimos proposta formal e termo de confidencialidade antes da rodada t\xE9cnica. Combinamos abertamente que qualquer um dos lados pode pedir intervalo para conferenciar.",r3:"Termo de confidencialidade assinado antes da reuni\xE3o t\xE9cnica. Definir os dois trechos e as janelas de acesso \xE0 faixa de servid\xE3o, com autoriza\xE7\xE3o de sobrevoo e protocolo de seguran\xE7a. Confirmar cobertura de seguro de responsabilidade civil da DroneCheck para opera\xE7\xE3o sobre linha energizada. Demonstra\xE7\xE3o em campo com data e local definidos. Documentos prontos antes: enunciado do desafio, minuta contratual, planilha de custos e nossa linha de base de inspe\xE7\xE3o. Acordar formato e periodicidade da entrega dos dados brutos. A gestora redige o resumo do acordado e circula em dois dias. O diretor de opera\xE7\xF5es assina o acordo final, ap\xF3s parecer do jur\xEDdico e do regulat\xF3rio. Entre as rodadas, a conversa segue por e-mail apenas para registro \u2014 nunca para negociar termos.",b1:"Quatro alternativas mapeadas: (a) desenvolver com o laborat\xF3rio da universidade parceira, que j\xE1 tem prot\xF3tipo funcional; (b) contratar a VistaLinha em modelo de servi\xE7o puro \u2014 resolve inspe\xE7\xE3o, mas n\xE3o desenvolve capacidade interna nem se enquadra como PDI; (c) adiar o projeto para o ciclo seguinte, mantendo a inspe\xE7\xE3o convencional; (d) estruturar o projeto com outra startup do nosso pr\xF3prio programa, hoje em TRL menor.",b2:"A rota com a universidade: preserva o car\xE1ter inovador e o enquadramento PDI, e desenvolve capacidade pr\xF3pria \u2014 que \xE9 o multiplicador na an\xE1lise de valor. Custa cerca de 40% mais e atrasa de 9 a 12 meses. Vale, portanto, o valor do projeto menos esse pr\xEAmio de tempo e custo. N\xE3o \xE9 confort\xE1vel, mas \xE9 real e verific\xE1vel.",b3a:"Sim: qualificar em paralelo um segundo proponente da mesma chamada, para n\xE3o dependermos de um \xFAnico parceiro. Tamb\xE9m podemos formalizar com o laborat\xF3rio uma carta de inten\xE7\xE3o com estimativa de prazo e custo \u2014 o que transforma a alternativa de conversa em documento.",b3b:"A limita\xE7\xE3o \xE9 o calend\xE1rio: a janela do ciclo or\xE7ament\xE1rio nos pressiona a fechar neste semestre. Se antecip\xE1ssemos a aprova\xE7\xE3o interna do envelope, poder\xEDamos esperar a pr\xF3xima rodada sem perder o ciclo \u2014 o que remove nossa principal fonte de pressa e fortalece a BATNA sem custo nenhum.",b3c:"Sim: dividir o desafio em duas frentes contrat\xE1veis separadamente \u2014 a captura de imagem por drone e o processamento por vis\xE3o computacional. Isso reduz a depend\xEAncia de um \xFAnico fornecedor e permite contratar a melhor solu\xE7\xE3o de cada frente.",b4:"Com a carta de inten\xE7\xE3o do laborat\xF3rio em m\xE3os, a aprova\xE7\xE3o do envelope antecipada e um segundo proponente qualificado, a BATNA passa a ser: desenvolver por rota alternativa sem perder o ciclo or\xE7ament\xE1rio, com dois caminhos poss\xEDveis. Deixamos de depender de um \xFAnico parceiro \u2014 e podemos recusar termos ruins sem custo de oportunidade relevante.",s1a:"Um piloto que caiba na al\xE7ada da \xE1rea, com laudo entregue em prazo menor que o atual, propriedade dos dados operacionais conosco e marco de valida\xE7\xE3o em seis meses com crit\xE9rio de aceita\xE7\xE3o definido em n\xFAmero.",s1b:"Nossa BATNA \xE9 a rota com a universidade: mais caro e mais lento, mas vi\xE1vel. Ent\xE3o o acordo com a DroneCheck precisa entregar, no m\xEDnimo, custo abaixo dessa rota e prazo menor \u2014 sen\xE3o n\xE3o vale fechar. A margem de melhoria \xE9 confort\xE1vel, o que nos permite negociar sem ansiedade.",s1c:"Janela do ciclo or\xE7ament\xE1rio e prazo de aprova\xE7\xE3o da diretoria. Disponibilidade da equipe de campo para acompanhar a demonstra\xE7\xE3o. Exig\xEAncias do jur\xEDdico sobre dados e propriedade intelectual. Enquadramento regulat\xF3rio do projeto. E a sa\xFAde financeira da DroneCheck: caixa curto do outro lado \xE9 risco de descontinuidade do projeto, n\xE3o vantagem a explorar \u2014 por isso o desembolso ser\xE1 escalonado por marcos.",s1d:"Teto na al\xE7ada da \xE1rea: acima disso o prazo de aprova\xE7\xE3o da diretoria inviabiliza o cronograma do ciclo. O piso n\xE3o \xE9 relevante aqui \u2014 proposta muito abaixo do custo plaus\xEDvel \xE9 sinal de que a contraparte n\xE3o dimensionou o escopo, e isso vira pergunta, n\xE3o desconto.",s1e:"M\xEDnimo, inegoci\xE1vel: propriedade dos dados operacionais brutos, laudo em formato integr\xE1vel aos nossos sistemas, marco de valida\xE7\xE3o em seis meses com op\xE7\xE3o de encerramento sem penalidade, e car\xE1ter inovador documentado de forma a sustentar o enquadramento PROPDI. M\xE1ximo que aceitamos conceder: exclusividade regional por 12 meses, com escopo delimitado e condicionada a performance.",s2a:"Mais interessados: propriedade dos dados, prazo de entrega do laudo e defini\xE7\xE3o dos crit\xE9rios de aceita\xE7\xE3o. Menos interessados: marca do equipamento, modelo de contrata\xE7\xE3o da equipe deles e a arquitetura interna do algoritmo \u2014 desde que audit\xE1vel.",s2b:"Sim. Aceitar prazo maior de execu\xE7\xE3o nos d\xE1 margem para exigir mais marcos de valida\xE7\xE3o intermedi\xE1ria. E conceder exclusividade regional limitada nos d\xE1 margem para exigir propriedade integral dos dados e pre\xE7o menor. J\xE1 ceder na propriedade dos dados n\xE3o nos compra nada que valha: \xE9 a condi\xE7\xE3o que sustenta todo o argumento de capacidade.",s2c:"Royalties s\xE3o negoci\xE1veis se a propriedade do dado operacional ficar conosco; o inverso, n\xE3o. Pre\xE7o \xE9 negoci\xE1vel dentro do teto. Cronograma \xE9 negoci\xE1vel se vier acompanhado de marcos. Propriedade dos dados e marco de valida\xE7\xE3o em seis meses n\xE3o s\xE3o negoci\xE1veis.",s2d:"Sim: em vez de reduzir o desembolso, contrapartida em treinamento da nossa equipe e integra\xE7\xE3o da solu\xE7\xE3o aos nossos sistemas. Tamb\xE9m tem valor equivalente uma extens\xE3o condicionada do piloto a um terceiro trecho, sem aumento de pre\xE7o, em troca da carta de refer\xEAncia e de visibilidade no programa.",s3:"Abaixo de um piloto que reduza o prazo do laudo, mantenha os dados operacionais conosco, tenha marco de valida\xE7\xE3o em seis meses com crit\xE9rio num\xE9rico e caiba na al\xE7ada da \xE1rea, n\xE3o fechamos: seguimos com a rota da universidade, j\xE1 com carta de inten\xE7\xE3o, e reabrimos o desafio na pr\xF3xima rodada.",m1:"\u201CAntes de falarmos de valores, queria entender como voc\xEAs enxergam esse problema e o que j\xE1 testaram. E uma combina\xE7\xE3o: se em algum momento a gente for injusto com voc\xEAs, avisem, que a gente corrige.\u201D",y1:"Validar em campo a inspe\xE7\xE3o aut\xF4noma de linhas por drones, em projeto de PDI, internalizando a capacidade de inspe\xE7\xE3o preditiva cont\xEDnua.",y2:"Propriedade dos dados operacionais brutos. Car\xE1ter inovador defens\xE1vel no enquadramento PROPDI. Marcos de valida\xE7\xE3o verific\xE1veis, com sa\xEDda limpa.",y3:"O que comp\xF5e a estrutura de custos do piloto de voc\xEAs? O que torna necess\xE1rio o prazo que voc\xEAs propuseram? Como vamos saber, em n\xFAmero, que o piloto deu certo?",y4:"Desenvolver por rota alternativa com o laborat\xF3rio da universidade parceira: vi\xE1vel e documentado por carta de inten\xE7\xE3o, por\xE9m cerca de 40% mais caro e 9 a 12 meses mais lento.",y5:"Piloto que reduza o prazo do laudo, mantenha os dados conosco, tenha marco de valida\xE7\xE3o em seis meses com crit\xE9rio num\xE9rico e caiba na al\xE7ada da \xE1rea. Abaixo disso, seguimos com a universidade.",y6:"Custo por quil\xF4metro inspecionado, medido no mesmo escopo do m\xE9todo atual, e taxa de detec\xE7\xE3o comparada a laudo de inspe\xE7\xE3o tripulada.",y7:"Cedemos flexibilidade no cronograma primeiro \u2014 contra marcos de valida\xE7\xE3o intermedi\xE1ria. Depois, exclusividade regional limitada \u2014 contra propriedade integral dos dados."};return Object.keys(o).forEach(a=>{e.caderno[a]=o[a]}),e.tabelas={trocas:[{cede:"Flexibilidade no cronograma de execu\xE7\xE3o",pede:"Marcos de valida\xE7\xE3o intermedi\xE1ria, com crit\xE9rio num\xE9rico"},{cede:"Acesso a campo de teste e a trechos instrumentados",pede:"Relat\xF3rio t\xE9cnico completo e dados brutos das inspe\xE7\xF5es"},{cede:"Carta de refer\xEAncia e visibilidade no programa",pede:"Pre\xE7o dentro do teto e extens\xE3o do piloto a um terceiro trecho"},{cede:"Exclusividade regional por 12 meses, com escopo delimitado",pede:"Propriedade integral dos dados operacionais e licen\xE7a de uso do modelo"}],papeis:[{papel:"L\xEDder \u2014 conduz e pergunta",nome:"Gestora do programa de inova\xE7\xE3o"},{papel:"T\xE9cnico \u2014 viabilidade e escopo",nome:"Engenheiro de manuten\xE7\xE3o de linhas"},{papel:"Controller \u2014 guarda a desist\xEAncia e os n\xFAmeros",nome:"Analista de planejamento do PDI"},{papel:"Observador \u2014 registra falas e rea\xE7\xF5es",nome:"Estagi\xE1rio do programa"}]},e.pessoas=[{nome:"CEO da DroneCheck (decide comercial)",estilo:"catalisador"},{nome:"CTO da DroneCheck (responde pela tecnologia)",estilo:"analitico"},{nome:"Investidor anjo (observador, consultado em PI)",estilo:"controlador"}],e.vcap={ativos:"Base propriet\xE1ria de imagens rotuladas das nossas linhas, com anomalias classificadas e laudo de refer\xEAncia \u2014 ativo que permanece nosso e permite treinar ou auditar qualquer modelo futuro. Modelo de vis\xE3o computacional licenciado para nossa opera\xE7\xE3o, calibrado para os perfis construtivos da nossa rede. Protocolo homologado de opera\xE7\xE3o de drone sobre linha energizada, incluindo plano de seguran\xE7a e matriz de risco.",processos:"Fluxo de inspe\xE7\xE3o aut\xF4noma com prioriza\xE7\xE3o por criticidade do ativo, substituindo a varredura por calend\xE1rio. Integra\xE7\xE3o do resultado da inspe\xE7\xE3o ao planejamento de manuten\xE7\xE3o, de modo que a detec\xE7\xE3o gere ordem de servi\xE7o sem etapa manual. Rotina de auditoria da precis\xE3o do modelo contra inspe\xE7\xE3o tripulada por amostragem, que mant\xE9m a confian\xE7a na ferramenta ao longo do tempo.",capacidades:"Capacidade de inspe\xE7\xE3o preditiva cont\xEDnua da rede, sem depender de janela de equipe em campo \u2014 a organiza\xE7\xE3o passa a saber antecipar falha em cadeia de isoladores em vez de reagir a ela. Capacidade de especificar, avaliar e auditar tecnicamente solu\xE7\xF5es de inspe\xE7\xE3o aut\xF4noma, o que nos torna comprador qualificado nas pr\xF3ximas contrata\xE7\xF5es do setor. Capacidade de operar drone sobre linha energizada com protocolo pr\xF3prio.",impactos:["Maior confiabilidade","Menor custo","Maior agilidade","Maior seguran\xE7a"],outros:"Redu\xE7\xE3o da exposi\xE7\xE3o de equipes a risco em trabalho em altura e em faixa de servid\xE3o de dif\xEDcil acesso.",sintese:"O projeto desenvolve ativos de dados e modelo, e transforma o processo de inspe\xE7\xE3o de calend\xE1rio para criticidade \u2014 mas o que sustenta o argumento de valor \xE9 a capacidade nova: inspe\xE7\xE3o preditiva cont\xEDnua e qualifica\xE7\xE3o t\xE9cnica para avaliar essa classe de tecnologia. Sem essa capacidade habilitada, ativos e processos n\xE3o gerariam valor, porque a estrutura \xE9 multiplicativa: um contrato que entregasse apenas o servi\xE7o de inspe\xE7\xE3o deixaria C igual a zero e, com ele, o valor inteiro \u2014 al\xE9m de descaracterizar o enquadramento PDI, j\xE1 que inspe\xE7\xE3o de rotina remunerada pela RAP \xE9 exclus\xE3o expressa. O impacto se materializa em confiabilidade, custo, agilidade e seguran\xE7a."},e},Vm=`
:root{
  --navy:#0E2A47; --navy-2:#16395E;
  --gold:#C9A227; --gold-soft:#F1E8CB; --gold-dim:#8A6D1D;
  --paper:#F7F4EC; --card:#fff; --ink:#22303E; --mut:#66717F; --line:#E3DECF;
  --serif:Cambria,Caladea,Georgia,"Times New Roman",serif;
  --sans:"Segoe UI","Helvetica Neue",Arial,sans-serif;
  --rail:248px; --measure:1180px;
  --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px;
  --shadow:0 1px 2px rgba(14,42,71,.04), 0 8px 24px -12px rgba(14,42,71,.12);
  --shadow-up:0 2px 4px rgba(14,42,71,.06), 0 16px 40px -16px rgba(14,42,71,.20);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit}
::selection{background:var(--gold-soft)}
:focus{outline:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:3px}

/* ---- barra superior ---- */
.topbar{position:sticky;top:0;z-index:50;background:var(--navy);
  border-bottom:3px solid var(--gold);
  display:flex;align-items:center;justify-content:space-between;gap:var(--s5);
  padding:var(--s3) var(--s6)}
.brand{display:flex;flex-direction:column;gap:2px;cursor:pointer;border:none;background:none;padding:0;text-align:left}
.brand-t{font-family:var(--serif);font-size:18px;font-weight:700;color:#fff;line-height:1.2}
.brand-t em{font-style:normal;font-weight:400;color:var(--gold)}
.brand-n{font-family:var(--sans);font-size:11.5px;letter-spacing:.08em;color:#9FB0C2}
.topnav{display:flex;align-items:center;gap:var(--s5)}
.topnav .tn{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--gold);
  background:none;border:none;cursor:pointer;padding:6px 2px;position:relative;transition:color .18s}
.topnav .tn::after{content:"";position:absolute;left:0;right:0;bottom:0;height:1.5px;
  background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform .22s}
.topnav .tn:hover{color:#fff}
.topnav .tn:hover::after,.topnav .tn.on::after{transform:scaleX(1)}
.ver{font-family:var(--sans);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:#7E93A8;padding-left:var(--s4);border-left:1px solid rgba(255,255,255,.14)}

/* ---- estrutura: trilha lateral + conte\xFAdo ---- */
.shell{display:flex;align-items:stretch;min-height:calc(100vh - 74px)}
.rail{width:var(--rail);flex:0 0 var(--rail);border-right:1px solid var(--line);
  background:#FBF9F3;padding:var(--s6) 0;display:flex;flex-direction:column}
.railhead{font-family:var(--sans);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--mut);padding:0 var(--s5) var(--s3)}
.railitem{display:flex;align-items:baseline;gap:var(--s3);width:100%;text-align:left;
  font-family:var(--sans);font-size:14px;font-weight:500;color:var(--mut);
  background:none;border:none;border-left:3px solid transparent;cursor:pointer;
  padding:10px var(--s5);transition:color .16s,background .16s,border-color .16s}
.railitem:hover{color:var(--navy);background:rgba(201,162,39,.07)}
.railitem.on{color:var(--navy);font-weight:700;background:var(--gold-soft);border-left-color:var(--gold)}
.railitem .rc{font-family:var(--sans);font-size:11px;color:var(--mut);margin-left:auto;font-weight:400}
.railitem.on .rc{color:var(--gold-dim)}
.subrail{margin:2px 0 var(--s4)}
.subrail .railitem{font-size:13.5px;padding-left:calc(var(--s5) + 14px)}
.railfoot{margin-top:auto;padding:var(--s5) var(--s5) 0;border-top:1px solid var(--line)}
.railfoot p{font-family:var(--serif);font-size:13.5px;font-style:italic;color:var(--navy);
  margin:var(--s4) 0 6px;line-height:1.45}
.railfoot span{font-family:var(--sans);font-size:10.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--mut)}

.main{flex:1;min-width:0}
.page{max-width:var(--measure);margin:0 auto;padding:var(--s7) var(--s6) var(--s8)}
.page.wide{max-width:1420px}

/* ---- cabe\xE7alho de p\xE1gina ---- */
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;
  gap:var(--s5);flex-wrap:wrap;padding-bottom:var(--s4);
  border-bottom:1px solid var(--line);margin-bottom:var(--s6)}
.eyebrow{font-family:var(--sans);font-size:11px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--gold);margin-bottom:var(--s2)}
h1.h1{font-family:var(--serif);font-size:34px;line-height:1.12;font-weight:700;
  color:var(--navy);margin:0;letter-spacing:-.01em}
.lede{font-family:var(--serif);font-size:17px;line-height:1.65;color:var(--mut);
  max-width:74ch;margin:0 0 var(--s6)}

/* ---- bot\xF5es ---- */
.btn{font-family:var(--sans);font-size:14px;font-weight:600;cursor:pointer;
  padding:11px 22px;border-radius:6px;background:var(--navy);color:#fff;
  border:1px solid var(--navy);transition:background .16s,transform .12s,box-shadow .16s;white-space:nowrap}
.btn:hover{background:var(--navy-2);box-shadow:var(--shadow)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--navy)}
.btn.ghost:hover{background:rgba(14,42,71,.06);box-shadow:none}
.btn.sm{font-size:12.5px;padding:7px 14px}

.chip{font-family:var(--sans);font-size:12.5px;font-weight:600;cursor:pointer;
  padding:6px 14px;border-radius:999px;background:transparent;color:var(--navy);
  border:1px solid var(--gold);margin:0 6px 6px 0;transition:background .16s,color .16s}
.chip:hover{background:var(--gold-soft)}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}

.tlink{font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--gold-dim);
  background:none;border:none;cursor:pointer;padding:4px 0;display:inline-flex;
  align-items:center;gap:5px;transition:color .16s}
.tlink:hover{color:var(--navy)}
.tlink-arrow{display:inline-block;transition:transform .2s}
.tlink:hover .tlink-arrow{transform:translateX(3px)}

/* ---- pain\xE9is e campos ---- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:26px}
.campo{margin-bottom:var(--s4)}
.lbl{font-family:var(--sans);font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--mut);margin-bottom:7px;line-height:1.45}
.inp{width:100%;padding:12px 14px;font-family:var(--serif);font-size:16.5px;line-height:1.6;
  color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:7px;
  transition:border-color .16s,box-shadow .16s;resize:vertical}
.inp:hover{border-color:#CFC7B2}
.inp:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,39,.13)}
.inp::placeholder{color:#A9B2BC;font-style:italic}

/* ---- grade de projetos ---- */
.grid{display:grid;gap:var(--s4);grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:24px;cursor:pointer;text-align:left;width:100%;
  display:flex;flex-direction:column;gap:var(--s4);
  transition:border-color .18s,box-shadow .18s,transform .18s}
.pcard:hover{border-color:var(--gold);box-shadow:var(--shadow-up);transform:translateY(-2px)}
.pcard-t{font-family:var(--serif);font-size:20px;font-weight:700;color:var(--navy);
  line-height:1.25;margin:0}
.pcard-m{font-family:var(--sans);font-size:12.5px;color:var(--mut);line-height:1.5}
.pcard-b{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s4);margin-top:auto}
.pct{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--gold);line-height:1;text-align:right}
.pct small{display:block;font-family:var(--sans);font-size:10.5px;font-weight:400;
  letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin-top:4px}

/* ---- medidor de prepara\xE7\xE3o por bloco do caderno ---- */
.gauge{display:flex;gap:3px;align-items:flex-end;flex:1}
.gauge .seg{flex:1;min-width:10px;height:28px;background:#EDE8DA;border-radius:2px;
  position:relative;overflow:hidden}
.gauge .seg i{position:absolute;left:0;right:0;bottom:0;background:var(--gold);
  transition:height .35s cubic-bezier(.4,0,.2,1)}
.gauge.lg .seg{height:44px}
.gaugekey{display:flex;gap:3px;margin-top:7px}
.gaugekey span{flex:1;min-width:10px;font-family:var(--sans);font-size:9.5px;
  letter-spacing:.02em;text-transform:uppercase;color:var(--mut);text-align:center;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---- estado vazio ---- */
.empty{border:1px dashed #CFC7B2;border-radius:10px;padding:var(--s8) var(--s6);
  text-align:center;background:rgba(255,255,255,.55)}
.empty h3{font-family:var(--serif);font-size:21px;color:var(--navy);margin:0 0 var(--s2)}
.empty p{font-family:var(--serif);font-size:15px;color:var(--mut);margin:0 auto var(--s5);max-width:44ch;line-height:1.6}

/* ---- cart\xF5es de teoria ---- */
.tcard{background:var(--card);border:1px solid var(--line);border-left:3px solid transparent;
  border-radius:8px;padding:20px 24px;margin-bottom:10px;cursor:pointer;width:100%;text-align:left;
  transition:border-color .18s,box-shadow .18s}
.tcard:hover{border-left-color:var(--gold);box-shadow:var(--shadow)}
.tcard.open{border-left-color:var(--gold);box-shadow:var(--shadow)}
.secmark{font-family:var(--sans);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--gold);border-bottom:1px solid var(--line);padding-bottom:8px;margin:var(--s6) 0 var(--s4)}

/* ---- utilit\xE1rios ---- */
h2.h2{font-family:var(--serif);font-size:22px;font-weight:700;color:var(--navy);margin:0 0 10px;line-height:1.25}
.sub{font-family:var(--serif);font-size:16.5px;color:var(--mut);line-height:1.65;margin:0 0 var(--s5);max-width:78ch;text-align:justify;hyphens:auto}
.stack>*+*{margin-top:var(--s4)}


/* ---- prosa: medida editorial, maior e justificada ---- */
.prose{font-family:var(--serif);font-size:17px;line-height:1.68;color:var(--ink);
  text-align:justify;text-justify:inter-word;hyphens:auto;-webkit-hyphens:auto;margin:0}
.prose+.prose{margin-top:14px}
.tbody{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,.8fr);
  gap:var(--s6);align-items:start;margin-top:18px}
.tbody .fullspan{grid-column:1/-1}
.gloss{background:var(--gold-soft);border-left:3px solid var(--gold);border-radius:0 7px 7px 0;
  padding:16px 18px;font-family:var(--serif);font-size:15.5px;line-height:1.62;color:var(--ink)}
.gloss b{display:block;font-family:var(--sans);font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--gold-dim);margin-bottom:7px}
@media (max-width:1180px){
  .tbody{grid-template-columns:1fr;gap:var(--s4)}
}

/* ---- caderno: campos em duas colunas em telas largas ---- */
.campos{display:grid;grid-template-columns:repeat(auto-fit,minmax(430px,1fr));
  gap:0 var(--s6)}
.campos .campo{margin-bottom:var(--s5)}
@media (max-width:900px){ .campos{grid-template-columns:1fr} }

/* ---- zona de exclus\xE3o ---- */
.danger{margin-top:var(--s5);padding-top:var(--s5);border-top:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:var(--s4);flex-wrap:wrap}
.danger p{font-family:var(--sans);font-size:12.5px;color:var(--mut);margin:0;max-width:52ch;line-height:1.5}
.btn.warn{background:transparent;color:#9C3F2E;border-color:#D8B4AB}
.btn.warn:hover{background:#FBEDE9;box-shadow:none}
.btn.warn.armed{background:#9C3F2E;color:#fff;border-color:#9C3F2E}
.pcard-x{position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:6px;
  border:none;background:transparent;color:#A9B2BC;font-size:17px;line-height:1;cursor:pointer;
  opacity:0;transition:opacity .16s,background .16s,color .16s}
.pcard{position:relative}
.pcard:hover .pcard-x{opacity:1}
.pcard-x:hover{background:#FBEDE9;color:#9C3F2E}
.pcard-x.armed{opacity:1;background:#9C3F2E;color:#fff;width:auto;padding:0 10px;font-family:var(--sans);font-size:11px;font-weight:700}


/* ---- caderno: exemplos, orienta\xE7\xF5es, itens numerados, tabelas ---- */
.exemplo{font-family:var(--serif);font-size:13.5px;font-style:italic;color:#8A8F97;
  line-height:1.5;margin:-2px 0 7px}
.campo.sub{padding-left:16px;border-left:2px solid var(--line)}
.numhead{grid-column:1/-1;font-family:var(--serif);font-size:17px;font-weight:700;
  color:var(--navy);margin:var(--s4) 0 var(--s3);padding-bottom:6px;
  border-bottom:1px solid var(--line)}
.guia{grid-column:1/-1;background:#F4F6F8;border-left:3px solid #8FA3B8;border-radius:0 7px 7px 0;
  padding:15px 18px;margin:0 0 var(--s5);font-family:var(--serif);font-size:14.5px;
  line-height:1.62;color:var(--ink);text-align:justify;hyphens:auto}
.guia b{display:block;font-family:var(--sans);font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:#4E6478;margin-bottom:7px;font-weight:700}
.notinha{grid-column:1/-1;font-family:var(--serif);font-size:14px;font-style:italic;
  color:var(--mut);margin:0 0 var(--s4);line-height:1.55}
.ordem-l{font-family:var(--serif);font-size:15.5px;line-height:1.6;color:var(--ink);margin-bottom:7px}
.ordem-l strong{color:var(--navy)}
.tabwrap{grid-column:1/-1;overflow-x:auto;margin:0 0 var(--s5)}
.tabpre{width:100%;border-collapse:collapse;min-width:520px}
.tabpre th{background:var(--navy);color:#fff;text-align:left;padding:9px 12px;
  font-family:var(--sans);font-size:11.5px;font-weight:700;letter-spacing:.04em;line-height:1.35}
.tabpre td{border:1px solid var(--line);padding:0}
.inpcel{width:100%;border:none;background:transparent;padding:11px 12px;
  font-family:var(--serif);font-size:15.5px;color:var(--ink);outline:none}
.inpcel:focus{background:rgba(201,162,39,.09)}

/* impress\xE3o: orienta\xE7\xF5es e exemplos s\xE3o andaimes, n\xE3o saem no dossi\xEA */


/* ---- dossi\xEA: tabelas e destaque da s\xEDntese ---- */
.dtab{width:100%;border-collapse:collapse;margin:6px 0 16px;font-family:var(--serif);font-size:15px}
.dtab th{background:var(--navy);color:#fff;text-align:left;padding:8px 11px;
  font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.04em}
.dtab td{border:1px solid var(--line);padding:9px 11px;vertical-align:top;line-height:1.5}
.dsintese{background:var(--gold-soft);border:1px solid var(--gold);border-radius:9px;
  padding:20px 24px;margin:var(--s5) 0}
.dsintese .dsec{margin-top:0;border-bottom-color:var(--gold)}


/* ---- quadro de refer\xEAncia: selos, tabela e nota ---- */
.selo{display:inline-block;font-family:var(--sans);font-size:9.5px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:3px;
  border:1px solid;margin:0 5px 4px 0;white-space:nowrap}
.qselos{display:flex;flex-wrap:wrap;margin-top:8px}
.quadro-filtros{display:flex;flex-wrap:wrap;margin:4px 0 var(--s4)}
.quadro-filtros .qn{opacity:.55;font-weight:400;margin-left:3px}
.quadro-desc{font-family:var(--serif);font-size:14.5px;font-style:italic;color:var(--mut);
  margin:0 0 var(--s4);line-height:1.55}
.quadro{width:100%;border-collapse:collapse;font-family:var(--serif);font-size:14.5px;
  margin:0 0 var(--s5)}
.quadro th{background:var(--navy);color:#fff;text-align:left;padding:10px 13px;
  font-family:var(--sans);font-size:10.5px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;vertical-align:bottom}
.quadro td{border-bottom:1px solid var(--line);padding:14px 13px;vertical-align:top;
  line-height:1.55;text-align:left}
.quadro tr:nth-child(even) td{background:#FCFAF5}
.quadro .qt{font-family:var(--serif);font-size:15.5px;font-weight:700;color:var(--navy);line-height:1.3}
.quadro .qs{font-family:var(--serif);font-size:13px;font-style:italic;color:var(--mut);margin-top:2px}
.quadro .qtaesa{border-left:2px solid var(--gold);background:rgba(241,232,203,.28)}
.quadro tr:nth-child(even) .qtaesa{background:rgba(241,232,203,.45)}
.quadro-nota{background:#F4F6F8;border-left:3px solid #8FA3B8;border-radius:0 7px 7px 0;
  padding:15px 18px;font-family:var(--serif);font-size:14px;line-height:1.62;color:var(--ink)}
.quadro-nota b{display:block;font-family:var(--sans);font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:#4E6478;margin-bottom:8px}
.quadro-nota p{margin:0 0 9px;text-align:justify;hyphens:auto}
.quadro-nota p:last-child{margin-bottom:0}
.taesa{background:#E8EDF3;border-left:3px solid var(--navy);border-radius:0 7px 7px 0;
  padding:15px 18px;font-family:var(--serif);font-size:15px;line-height:1.62;color:var(--ink);
  text-align:justify;hyphens:auto}
.taesa b{display:block;font-family:var(--sans);font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--navy);margin-bottom:7px;font-weight:700}


/* ---- responsivo ---- */
@media (max-width:1080px){
  :root{--rail:212px}
  .page{padding:var(--s6) var(--s5) var(--s7)}
  h1.h1{font-size:29px}
}

/* ---------- celular e tablet estreito ---------- */
@media (max-width:820px){
  html{overflow-x:hidden}
  body{-webkit-tap-highlight-color:rgba(201,162,39,.18)}

  /* barra superior compacta: s\xF3 a marca; a navega\xE7\xE3o vive na trilha */
  .topbar{padding:11px var(--s4);gap:var(--s3);
    padding-left:max(var(--s4),env(safe-area-inset-left));
    padding-right:max(var(--s4),env(safe-area-inset-right))}
  .brand-t{font-size:15.5px;line-height:1.25}
  .brand-x{display:none}
  .brand-n{font-size:10.5px;letter-spacing:.06em}
  .topnav{display:none}

  /* trilha vira faixa horizontal rol\xE1vel, presa abaixo da barra */
  .shell{display:block}
  .rail{position:sticky;top:57px;z-index:40;
    width:auto;flex:none;background:#FBF9F3;
    border-right:none;border-bottom:1px solid var(--line);
    display:block;padding:0;
    overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;
    scrollbar-width:none}
  .rail::-webkit-scrollbar{display:none}
  .rail>.railgroup{display:flex;align-items:stretch;width:max-content;min-width:100%;
    padding-left:max(0px,env(safe-area-inset-left))}
  .rail>.railfoot{display:none}
  .railhead{display:none}
  .railsep{width:1px;flex:0 0 1px;background:var(--line);margin:9px 6px}
  .subrail{margin:0;display:contents}
  .railitem{width:auto;flex:0 0 auto;white-space:nowrap;
    border-left:none;border-bottom:3px solid transparent;
    padding:14px var(--s4);font-size:14.5px;min-height:48px;align-items:center}
  .railitem.on{border-left-color:transparent;border-bottom-color:var(--gold);
    background:transparent;color:var(--navy)}
  .railitem:hover{background:transparent}
  .railitem .rc{margin-left:7px}
  .subrail .railitem{padding-left:var(--s4);font-size:14px}
  .subrail .railitem::before{content:"";display:inline-block;width:5px;height:5px;
    border-radius:50%;background:var(--gold);margin-right:8px;opacity:.45;align-self:center}
  .subrail .railitem.on::before{opacity:1}

  /* conte\xFAdo */
  .page,.page.wide{padding:var(--s5) var(--s4) var(--s8);
    padding-left:max(var(--s4),env(safe-area-inset-left));
    padding-right:max(var(--s4),env(safe-area-inset-right))}
  h1.h1{font-size:24px;letter-spacing:0}
  .eyebrow{font-size:10px;letter-spacing:.14em}
  .pagehead{flex-direction:column;align-items:stretch;gap:var(--s4);
    padding-bottom:var(--s3);margin-bottom:var(--s5)}
  .pagehead .btn{width:100%;text-align:center;padding:13px 20px}
  .lede{font-size:16px;max-width:none}
  .sub{font-size:15.5px;text-align:left;hyphens:none}
  .prose{font-size:16px;text-align:left;hyphens:none}
  .panel{padding:18px 16px;border-radius:9px}

  /* cart\xF5es de projeto */
  .grid{grid-template-columns:1fr;gap:var(--s3)}
  .pcard{padding:20px 18px}
  .pcard-t{font-size:18.5px}
  .pcard-x{opacity:1;top:10px;right:10px}
  .gauge .seg{height:22px}
  .pct{font-size:23px}

  /* teoria */
  .tcard{padding:17px 16px}
  .tbody{gap:var(--s4);margin-top:14px}
  .gloss{padding:14px 15px;font-size:15px}

  /* caderno */
  .campos{grid-template-columns:1fr;gap:0}
  .campo.sub{padding-left:12px}
  .guia{padding:13px 15px;font-size:14px;text-align:left;hyphens:none}
  .numhead{font-size:16px}
  .inp{font-size:16px}
  .exemplo{font-size:13px}

  /* tabelas viram fichas empilhadas, sem rolagem lateral */
  .tabwrap{overflow:visible}
  .tabpre{min-width:0;display:block}
  .tabpre thead{display:none}
  .tabpre tbody{display:block}
  .tabpre tr{display:block;border:1px solid var(--line);border-radius:8px;
    margin-bottom:10px;overflow:hidden}
  .tabpre td{display:block;border:none;border-bottom:1px solid var(--line);position:relative}
  .tabpre tr td:last-child{border-bottom:none}
  .tabpre td::before{content:attr(data-rot);display:block;
    font-family:var(--sans);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--mut);padding:9px 12px 0}
  .inpcel{padding:5px 12px 11px;font-size:15.5px}

  /* quadro de refer\xEAncia empilha */
  .quadro{display:block;font-size:15px}
  .quadro thead{display:none}
  .quadro tbody{display:block}
  .quadro tr{display:block;border:1px solid var(--line);border-radius:9px;
    margin-bottom:12px;overflow:hidden;background:#fff}
  .quadro tr:nth-child(even) td{background:transparent}
  .quadro td{display:block;border-bottom:1px solid var(--line);padding:13px 15px}
  .quadro tr td:last-child{border-bottom:none}
  .quadro td::before{content:attr(data-rot);display:block;font-family:var(--sans);
    font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-bottom:5px}
  .quadro td:first-child::before{display:none}
  .quadro .qtaesa{border-left:none;border-top:2px solid var(--gold);
    background:rgba(241,232,203,.35)!important}
  .quadro-nota,.taesa{padding:13px 15px;font-size:14px;text-align:left;hyphens:none}
  .quadro-nota p{text-align:left;hyphens:none}

  /* dossi\xEA */
  .dtab{font-size:14px;display:block}
  .dtab thead{display:none}
  .dtab tbody{display:block}
  .dtab tr{display:block;border:1px solid var(--line);border-radius:7px;margin-bottom:9px}
  .dtab td{display:block;border:none;border-bottom:1px solid var(--line);padding:9px 11px}
  .dtab tr td:last-child{border-bottom:none}
  .dtab td::before{content:attr(data-rot);display:block;font-family:var(--sans);
    font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-bottom:3px}
  .dsintese{padding:16px 15px}
}

/* ---------- telas muito estreitas ---------- */
@media (max-width:400px){
  .brand-t{font-size:14.5px}
  h1.h1{font-size:21px}
  .railitem{padding:13px 13px;font-size:13.5px}
  .panel{padding:15px 13px}
  .pcard{padding:17px 15px}
  .pcard-b{flex-direction:column;align-items:stretch;gap:var(--s3)}
  .pct{text-align:left}
}

@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
@media print{
  /* preserva navy, dourado e fundos \u2014 sem isto o navegador imprime tudo em branco */
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  @page{size:A4;margin:16mm 15mm}
  html,body{background:#fff}
  .topbar,.rail,.so-tela,.pagehead{display:none!important}
  .shell{display:block}
  .main{display:block}
  .page,.page.wide{max-width:none;margin:0;padding:0}
  .panel{border:none;border-radius:0;padding:0;background:transparent}
  .dossie{border-top:none!important}

  /* corpo do documento impresso */
  body{font-size:10.5pt;line-height:1.5}
  .prose{font-size:10.5pt;line-height:1.5;text-align:justify}
  .dsec{font-size:13pt;page-break-after:avoid;break-after:avoid}
  .ditem{page-break-inside:avoid;break-inside:avoid}
  .dblock{page-break-inside:auto}
  .dcapa{page-break-inside:avoid;break-inside:avoid}

  /* nada de \xF3rf\xE3os e vi\xFAvas */
  p,div{orphans:3;widows:3}
  h1,h2,h3,.h2{page-break-after:avoid;break-after:avoid}

  /* lembretes come\xE7am em p\xE1gina nova */
  .dlembretes{page-break-before:always;break-before:page}
  .dsintese{page-break-after:always;break-after:page;page-break-inside:avoid;
    border:2px solid #C9A227;padding:14px 16px}
  .dtab{page-break-inside:avoid;break-inside:avoid;font-size:9.5pt}

  /* figuras e tabelas inteiras */
  svg,table,.gloss,.note,.taesa,.quadro-nota{page-break-inside:avoid;break-inside:avoid}
  .quadro tr{page-break-inside:avoid;break-inside:avoid}

  /* links n\xE3o precisam de destaque no papel */
  .tlink,.btn,.chip{display:none!important}
